<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命题组 · 布局预览</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --line:#e5e7eb; --line2:#eef0f3;
    --ink:#1f2430; --muted:#6b7280; --muted2:#9aa1ac;
    --accent:#4f46e5; --accent-soft:#eef0ff;
    --ok:#0f9d6e; --ok-soft:#e8f7f1;
    --warn:#b7791f; --warn-soft:#fdf5e6;
    --bad:#c0392b; --bad-soft:#fdecea;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:54px; display:flex; align-items:center; gap:14px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:baseline; gap:8px; font-weight:650; letter-spacing:.2px}
  .brand small{font-weight:400; color:var(--muted2); font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .paper-title{font-size:13px;color:var(--muted); border-left:1px solid var(--line); padding-left:12px}
  .paper-title b{color:var(--ink);font-weight:600}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
  .chip{
    font-size:11.5px; color:#414755; background:#f7f8fa; border:1px solid var(--line);
    padding:3px 8px; border-radius:999px; white-space:nowrap;
  }
  .chip.ban{color:var(--bad); background:var(--bad-soft); border-color:#f5d6d2}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff}
  .seg button{
    border:0; background:transparent; padding:5px 11px; font-size:12px; color:var(--muted);
    cursor:pointer; font-family:inherit;
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent); color:#fff; font-weight:600}
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--ink); font-family:inherit;
    padding:6px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{border-color:#cfd4dc}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.primary:hover{background:#453cd6}
  .btn.mini{padding:3px 9px; font-size:11.5px; border-radius:7px}

  /* ---------- 三栏 ---------- */
  .shell{display:grid; grid-template-columns:228px 396px 1fr; height:calc(100vh - 54px)}
  .col{min-height:0; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line)}
  .col:last-child{border-right:0; background:var(--bg)}
  .col-head{
    padding:10px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:8px; background:var(--panel);
  }
  .col-body{flex:1; overflow:auto; padding:10px}
  .col-body.pad0{padding:0}

  /* ---------- 会话列表 ---------- */
  .sess{
    border:1px solid var(--line); border-radius:var(--radius); padding:9px 10px; margin-bottom:8px;
    cursor:pointer; background:#fff;
  }
  .sess.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
  .sess .t{font-size:12.5px; font-weight:600; display:flex; justify-content:space-between; gap:6px}
  .sess .s{font-size:11px; color:var(--muted2); margin-top:3px}

  /* ---------- 中栏：工作流 ---------- */
  .msg{display:flex; gap:8px; margin-bottom:12px}
  .msg .av{
    width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;
    font-size:11px;font-weight:700;color:#fff;background:#c7cbd4;margin-top:2px;
  }
  .msg.user .av{background:#8b93a3}
  .msg.user .bub{
    background:#f1f2f5; border:1px solid var(--line2); border-radius:10px; padding:9px 11px; font-size:13px;
  }
  .msg.sys .av{background:var(--accent)}
  .msg.sys .bub{padding:0; background:transparent}

  .step{border:1px solid var(--line); border-radius:var(--radius); background:#fff; margin-bottom:8px; overflow:hidden; box-shadow:var(--shadow)}
  .step>summary{
    list-style:none; cursor:pointer; padding:8px 10px; font-size:12.5px; display:flex; gap:8px; align-items:flex-start;
  }
  .step>summary::-webkit-details-marker{display:none}
  .step .ico{
    width:18px;height:18px;flex:0 0 18px;border-radius:5px;display:grid;place-items:center;
    font-size:10px; background:#f2f3f6; color:#4b5563; margin-top:1px;
  }
  .step .label{flex:1}
  .step .label .k{font-weight:600}
  .step .label .v{color:var(--muted); font-size:11.5px; margin-top:2px; display:block}
  .step[open]>summary{border-bottom:1px solid var(--line2); background:#fcfcfd}
  .step .detail{padding:9px 10px; font-size:12px; color:#404652; background:#fcfcfd}
  .step .detail table{width:100%; border-collapse:collapse; font-size:11.5px}
  .step .detail th,.step .detail td{border-bottom:1px solid var(--line2); padding:4px 6px; text-align:left}
  .step .detail th{color:var(--muted2); font-weight:500}
  .step.deny .ico{background:var(--warn-soft); color:var(--warn)}
  .step.ok .ico{background:var(--ok-soft); color:var(--ok)}
  .step.fig .detail{display:flex; gap:10px; align-items:center}
  .thumb{border:1px solid var(--line); border-radius:8px; background:#fff; padding:2px}

  .composer{border-top:1px solid var(--line); padding:10px; background:var(--panel)}
  .quick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .quick button{
    border:1px solid var(--line); background:#fbfbfc; color:#4b5563; border-radius:999px;
    padding:4px 10px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .quick button:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .inputbox{
    display:flex; gap:8px; align-items:flex-end; border:1px solid var(--line); border-radius:10px; padding:8px;
    background:#fff;
  }
  .inputbox textarea{
    flex:1; border:0; outline:0; resize:none; height:38px; font:inherit; font-size:13px; color:var(--ink);
    background:transparent;
  }
  .hintbar{font-size:11px; color:var(--muted2); margin-top:6px}

  /* ---------- 右栏：制品 ---------- */
  .tabs{display:flex; gap:2px; padding:8px 12px 0; background:var(--panel); border-bottom:1px solid var(--line)}
  .tabs button{
    border:0; background:transparent; font-family:inherit; font-size:12.5px; color:var(--muted);
    padding:8px 12px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabs button.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:650}
  .tabs .right{margin-left:auto; display:flex; align-items:center; gap:8px; padding-bottom:6px}

  .diffbar{
    margin:10px 12px 0; padding:8px 10px; border:1px solid #dcdffb; background:var(--accent-soft);
    color:#3b34b8; border-radius:8px; font-size:12px; display:flex; gap:8px; align-items:center;
  }
  .paper{padding:12px 12px 40px; overflow:auto}
  .sheet{
    background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:18px 20px; max-width:820px; margin:0 auto;
  }
  .sheet-head{border-bottom:1px dashed #d8dbe2; padding-bottom:10px; margin-bottom:14px}
  .sheet-head h1{margin:0 0 4px; font-size:16px; letter-spacing:.3px}
  .sheet-head .meta{font-size:11.5px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap}
  .q{border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; margin-bottom:11px; background:#fff}
  .q.flag{border-color:#f0d9a8; background:#fffdf7}
  .q.replaced{box-shadow:0 0 0 2px var(--accent-soft)}
  .q-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .q-no{font-weight:700; font-size:13px}
  .q-no small{font-weight:500; color:var(--muted2); margin-left:4px}
  .q-stem{font-size:13.5px; line-height:1.75}
  .q-stem .opt{margin-top:4px; color:#3b414d}
  .figbox{margin-top:9px; border:1px dashed var(--line); border-radius:8px; padding:6px; display:inline-block; background:#fff}
  .q-foot{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .badge{
    font-size:11px; padding:2px 7px; border-radius:6px; border:1px solid var(--line);
    background:#fafbfc; color:#4b5563; white-space:nowrap;
  }
  .badge.ok{background:var(--ok-soft); border-color:#cdece0; color:var(--ok)}
  .badge.warn{background:var(--warn-soft); border-color:#f0dcb4; color:var(--warn)}
  .badge.bad{background:var(--bad-soft); border-color:#f5d6d2; color:var(--bad)}
  .badge.info{background:var(--accent-soft); border-color:#dcdffb; color:#3b34b8}
  .reason{
    margin-top:8px; font-size:12px; color:var(--warn); background:var(--warn-soft);
    border:1px solid #f0dcb4; border-radius:8px; padding:7px 9px;
  }
  .ans{margin-top:9px; border-top:1px dashed #e2e5ea; padding-top:9px; font-size:12.5px; color:#3b414d; display:none}
  .ans.open{display:block}
  .ans h4{margin:0 0 4px; font-size:12px; color:var(--muted)}
  .ans ol{margin:4px 0 0 18px; padding:0}
  .ans li{margin-bottom:3px}

  /* ---------- 知识网络 ---------- */
  .netwrap{padding:12px}
  .netcard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:8px 0 6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .netstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .stat .n{font-size:18px;font-weight:700}
  .stat .l{font-size:11px;color:var(--muted2);margin-top:2px}

  /* ---------- 证据 ---------- */
  .evwrap{padding:12px}
  .evcard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}
  .evcard h3{margin:0 0 8px;font-size:13px}
  table.grid{width:100%;border-collapse:collapse;font-size:12px}
  table.grid th,table.grid td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left}
  table.grid th{color:var(--muted2);font-weight:500;font-size:11.5px}
  .klist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}

  .note{font-size:11px;color:var(--muted2);margin-top:10px;text-align:center}
  .ribbon{
    position:fixed; right:12px; bottom:12px; z-index:50;
    background:#1f2430; color:#fff; font-size:11.5px; padding:6px 11px; border-radius:999px; opacity:.9;
  }
  @media (max-width:1100px){
    .shell{grid-template-columns:1fr; height:auto}
    .col{height:auto; border-right:0; border-bottom:1px solid var(--line)}
    .col-body{max-height:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>命题组 <small>ExamHarness · 布局预览</small></div>
  <div class="paper-title">九上 · 第22章 二次函数 · <b>课后作业</b> <span class="mono" id="verLabel">v3</span></div>
  <div class="chips">
    <span class="chip">一课时 40 分钟</span>
    <span class="chip">10 题</span>
    <span class="chip">难度 0.70–0.85</span>
    <span class="chip">重点：顶点式 / 对称轴</span>
    <span class="chip ban">禁用：动点题</span>
    <span class="chip ban">禁用：实际问题建模</span>
  </div>
  <div class="seg" id="verSeg">
    <button data-v="v1">v1</button>
    <button data-v="v2">v2</button>
    <button data-v="v3" class="on">v3</button>
  </div>
  <button class="btn primary">定稿导出 Word</button>
</header>

<div class="shell">

  <!-- 左：会话 -->
  <aside class="col">
    <div class="col-head">会话</div>
    <div class="col-body">
      <div class="sess on">
        <div class="t"><span>课后作业卷</span><span class="badge info">进行中</span></div>
        <div class="s">九上·二次函数 · 初三(2)班 · 21:07</div>
      </div>
      <div class="sess">
        <div class="t"><span>单元检测小卷</span></div>
        <div class="s">九上·二次函数 · 初三(2)班 · 昨天</div>
      </div>
      <div class="sess">
        <div class="t"><span>周测卷</span></div>
        <div class="s">九上·一元二次方程 · 初三(2)班 · 10-01</div>
      </div>
      <div class="note">每次会话都留着：需求、拒绝原因、人工确认记录</div>
    </div>
  </aside>

  <!-- 中：工作流 -->
  <section class="col">
    <div class="col-head">命题组工作记录 <span class="mono" style="margin-left:auto;color:var(--muted2)">点开每一步看细节</span></div>
    <div class="col-body" id="flow"></div>
    <div class="composer">
      <div class="quick" id="quick"></div>
      <div class="inputbox">
        <textarea placeholder="继续说需求 / 纠正 / 只改某一道题…（Enter 发送）"></textarea>
        <button class="btn primary">发送</button>
      </div>
      <div class="hintbar">按钮只是预设指令的快捷方式——本质都是往这个会话里说一句话。</div>
    </div>
  </section>

  <!-- 右：制品 -->
  <section class="col">
    <div class="tabs">
      <button class="on" data-tab="paper">卷子</button>
      <button data-tab="net">知识网络</button>
      <button data-tab="ev">证据</button>
      <div class="right">
        <button class="btn mini" id="flagFilter">只看待复核 (0)</button>
      </div>
    </div>
    <div class="col-body pad0" id="stage"></div>
  </section>
</div>

<div class="ribbon">静态布局草图 · 数据为示意</div>

<script>
/* ============== 数据（示意） ============== */
const VERSIONS = {
  v1: { note: "初次成卷：10 题到齐，2 题待复核", replaced: [], flag: [6,9], confirmed: [] },
  v2: { note: "已按指令替换第 3 题，第 6 题重做通过；第 9 题仍待复核", replaced: [3], flag: [9], confirmed: [] },
  v3: { note: "第 9 题由老师人工确认（21:14）→ 全卷可定稿", replaced: [3], flag: [], confirmed: [9] },
};

const QS = [
  { no:1, type:"选择", score:3, diff:0.80, dup:0.06, stem:"抛物线 y = x² − 4x + 3 的顶点坐标是（　　）",
    opts:["A. (2, −1)","B. (−2, −1)","C. (2, 1)","D. (1, 0)"],
    ans:"A", sol:["配方：y = (x−2)² − 1","顶点 (2, −1)","对称轴 x = 2"] },

  { no:2, type:"选择", score:3, diff:0.78, dup:0.09, stem:"二次函数 y = −2(x+1)² + 3 的图象开口方向与对称轴分别是（　　）",
    opts:["A. 向上，x = 1","B. 向下，x = 1","C. 向上，x = −1","D. 向下，x = −1"],
    ans:"D", sol:["a = −2 < 0 → 开口向下","顶点式对称轴 x = −1"] },

  { no:3, type:"选择", score:3, diff:0.72, dup:0.11, fig:"parabola",
    stem:"如图，抛物线 y = x² − 4x + 3 与 x 轴交于 A、B 两点，则线段 AB 的长为（　　）",
    opts:["A. 1","B. 2","C. 3","D. 4"],
    ans:"B", sol:["令 y = 0：x² − 4x + 3 = 0 → x₁ = 1, x₂ = 3","AB = |3 − 1| = 2"] },

  { no:4, type:"选择", score:3, diff:0.75, dup:0.07, stem:"若抛物线 y = ax² + bx + c 的对称轴为 x = 3，则下列一定成立的是（　　）",
    opts:["A. a > 0","B. b = −6a","C. c = 0","D. a + b + c = 0"],
    ans:"B", sol:["对称轴 x = −b/(2a) = 3 → b = −6a"] },

  { no:5, type:"选择", score:3, diff:0.74, dup:0.05, stem:"将抛物线 y = x² 先向右平移 2 个单位，再向上平移 1 个单位，所得抛物线的解析式为（　　）",
    opts:["A. y = (x+2)² + 1","B. y = (x−2)² + 1","C. y = (x−2)² − 1","D. y = (x+2)² − 1"],
    ans:"B", sol:["左加右减、上加下减","顶点 (0,0) → (2,1)"] },

  { no:6, type:"选择", score:3, diff:0.70, dup:0.08, stem:"二次函数 y = x² − 2x + m 的图象与 x 轴有两个不同交点，则 m 的取值范围是（　　）",
    opts:["A. m < 1","B. m > 1","C. m ≤ 1","D. m < −1"],
    ans:"A", sol:["Δ = 4 − 4m > 0 → m < 1"],
    reason:"回译后条件数不一致：题干未说明 a > 0 时与构造实例的其中一个解不吻合 → 已自动重做 2 次后通过" },

  { no:7, type:"选择", score:3, diff:0.73, dup:0.10, stem:"已知二次函数 y = x² − 4x + 3，当 0 ≤ x ≤ 4 时，y 的最小值为（　　）",
    opts:["A. −1","B. 0","C. 3","D. 4"],
    ans:"A", sol:["顶点 x = 2 在区间内","y_min = y(2) = −1"] },

  { no:8, type:"选择", score:3, diff:0.76, dup:0.04, stem:"若点 A(−1, y₁)、B(3, y₂) 都在抛物线 y = x² − 4x + 3 上，则 y₁ 与 y₂ 的大小关系是（　　）",
    opts:["A. y₁ > y₂","B. y₁ < y₂","C. y₁ = y₂","D. 无法确定"],
    ans:"C", sol:["对称轴 x = 2，−1 与 3 到 x=2 的距离都是 3","故 y₁ = y₂"] },

  { no:9, type:"解答", score:8, diff:0.62, dup:0.07, fig:"geom", confirmed:true,
    stem:"如图，在平面直角坐标系中，O 为原点，点 E(3, 1)、F(2.2, 2.2)。求 OE 与 OF 的长，并比较大小。",
    ans:"OE = √10 ≈ 3.162；OF ≈ 3.111；OE > OF",
    sol:["OE = √(3² + 1²) = √10","OF = √(2.2² + 2.2²) ≈ 3.111","故 OE > OF"],
    reason:"图形规范拦截 2 次：OE 与 OF 视觉长度过于接近，易暗示「相等」→ 已重绘并拉大视觉差异；老师已人工确认" },

  { no:10, type:"解答", score:8, diff:0.58, dup:0.09,
    stem:"已知抛物线 y = ax² + bx + c 经过点 A(1, 0)、B(3, 0)，且顶点纵坐标为 −1，求该抛物线的解析式。",
    ans:"y = (x − 2)² − 1，即 y = x² − 4x + 3",
    sol:["设 y = a(x−1)(x−3)","顶点 x = 2，代入得 a(2−1)(2−3) = −1 → a = 1","展开：y = x² − 4x + 3"] },
];

const FLOW = [
  { ico:"›", k:"读取会话约定", v:"进度 = 九上·22章·第2课时 · 班级 = 初三(2)班 · 禁用清单 2 条", open:false,
    d:`<div class="mono" style="font-size:11.5px">教学进度：二次函数图象与性质（第2课时）<br>已学前置：一次函数 ✓　图象平移 ✓（本卷允许）<br>禁用：动点问题、实际问题建模（未学）</div>` },

  { ico:"◱", k:"生成双向细目表草案", v:"9 个题位 · 覆盖 5 个知识点 · 认知水平：理解 3 / 掌握 5 / 运用 2", open:false,
    d:`<table><tr><th>知识点</th><th>认知</th><th>题型</th><th>题量</th><th>难度</th></tr>
       <tr><td>二次函数图象</td><td>理解</td><td>选择</td><td>2</td><td>0.78–0.80</td></tr>
       <tr><td>顶点式与对称轴</td><td>掌握</td><td>选择</td><td>3</td><td>0.72–0.76</td></tr>
       <tr><td>与坐标轴交点</td><td>掌握</td><td>选择·解答</td><td>2</td><td>0.62–0.72</td></tr>

const QUICK = ["第 3 题换一道","再补两道解答题","整体难度再降一档","重排顺序（由易到难）","导出前先看证据"];

/* ============== 图形 ============== */
function parabolaSVG(w,h){
  const xmin=-0.6,xmax=4.6,ymin=-1.6,ymax=4.6, pad=14;
  const X=x=>pad+(x-xmin)/(xmax-xmin)*(w-2*pad);
  const Y=y=>h-pad-(y-ymin)/(ymax-ymin)*(h-2*pad);
  let pts=[];
  for(let i=0;i<=64;i++){const x=xmin+(xmax-xmin)*i/64;pts.push(`${X(x).toFixed(1)},${Y(x*x-4*x+3).toFixed(1)}`)}
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${Y(0)}" x2="${w-4}" y2="${Y(0)}" stroke="#9aa1ac" stroke-width="1"/>
    <line x1="${X(0)}" y1="${h-4}" x2="${X(0)}" y2="4" stroke="#9aa1ac" stroke-width="1"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
    <circle cx="${X(2)}" cy="${Y(-1)}" r="2.4" fill="#c0392b"/>
    <text x="${X(2)+4}" y="${Y(-1)+11}" font-size="9" fill="#c0392b">(2,−1)</text>
    <circle cx="${X(1)}" cy="${Y(0)}" r="2.2" fill="#1f2430"/>
    <circle cx="${X(3)}" cy="${Y(0)}" r="2.2" fill="#1f2430"/>
    <text x="${X(1)-3}" y="${Y(0)-5}" font-size="9" fill="#1f2430">A</text>
    <text x="${X(3)+3}" y="${Y(0)-5}" font-size="9" fill="#1f2430">B</text>
    <text x="${w-16}" y="${Y(0)+11}" font-size="9" fill="#6b7280">x</text>
    <text x="${X(0)+5}" y="12" font-size="9" fill="#6b7280">y</text>
  </svg>`;
}
function geomSVG(w,h){
  const ox=16, oy=h-16, s=26;
  const P=(x,y)=>[ox+x*s, oy-y*s];
  const [ex,ey]=P(3,1), [fx,fy]=P(2.2,2.2);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="${ox}" y1="${oy}" x2="${w-6}" y2="${oy}" stroke="#9aa1ac"/>
    <line x1="${ox}" y1="${oy}" x2="${ox}" y2="6" stroke="#9aa1ac"/>
    <line x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="#4f46e5" stroke-width="1.6"/>
    <line x1="${ox}" y1="${oy}" x2="${fx}" y2="${fy}" stroke="#0f9d6e" stroke-width="1.6"/>
    <circle cx="${ex}" cy="${ey}" r="2.4" fill="#4f46e5"/><text x="${ex+4}" y="${ey+3}" font-size="9" fill="#4f46e5">E</text>
    <circle cx="${fx}" cy="${fy}" r="2.4" fill="#0f9d6e"/><text x="${fx+4}" y="${fy+3}" font-size="9" fill="#0f9d6e">F</text>
    <circle cx="${ox}" cy="${oy}" r="2" fill="#1f2430"/><text x="${ox-10}" y="${oy+12}" font-size="9" fill="#1f2430">O</text>
    <text x="${w/2-30}" y="${h-4}" font-size="8.5" fill="#9aa1ac">已拉大视觉差异</text>
  </svg>`;
}

/* ============== 渲染 ============== */
let VER='v3', TAB='paper', onlyFlag=false;

function currentQS(){
  const V=VERSIONS[VER];
  return QS.map(q=>{
    const o={...q};
    if(V.replaced.includes(q.no)){ o.replaced=true; }
    if(q.no===3 && V.replaced.includes(3)){
      o.stem="如图，抛物线 y = x² − 4x + 3 与 x 轴交于 A、B，与 y 轴交于 C，则 △ABC 的面积为（　　）";
      o.opts=["A. 1","B. 1.5","C. 3","D. 6"]; o.ans="C";
      o.sol=["C(0, 3)","AB = 2","S = ½ × 2 × 3 = 3"];
      o.stemNote="（按指令替换：原题过于接近课本例题）";
    }
    if(q.no===6) o.flag = V.flag.includes(6);
    if(q.no===9){ o.flag = V.flag.includes(9); o.confirmed = V.confirmed.includes(9); }
    return o;
  });
}

function badge(t,cls){return `<span class="badge ${cls||''}">${t}</span>`}

function qHTML(q){
  const V=VERSIONS[VER];
  const flags=[];
  flags.push(badge("符号 ✅","ok"));
  flags.push(badge("知识边界 ✅","ok"));
  flags.push(badge("查重 "+q.dup.toFixed(2), q.dup<0.15?"ok":"warn"));
  flags.push(badge("难度 "+q.diff.toFixed(2)));
  flags.push(badge("原创度 "+Math.round((1-q.dup*2)*100)+"%","info"));
  if(q.fig) flags.push(badge("图形 ✅","ok"));
  if(q.confirmed) flags.push(badge("人工确认 · 老师 21:14","ok"));
  if(q.flag) flags.push(badge("待复核","warn"));
  if(q.replaced) flags.push(badge("已替换","info"));

  return `<div class="q ${q.flag?'flag':''} ${q.replaced?'replaced':''}" data-no="${q.no}">
    <div class="q-head">
      <span class="q-no">第 ${q.no} 题 <small>${q.type} · ${q.score} 分</small></span>
      ${flags.join('')}
    </div>
    <div class="q-stem">${q.stem}
      ${q.stemNote?`<span style="color:var(--muted2);font-size:11.5px">${q.stemNote}</span>`:''}
      ${q.opts?`<div class="opt">${q.opts.join('　　')}</div>`:''}
    </div>
    ${q.fig?`<div class="figbox">${q.fig==='parabola'?parabolaSVG(150,110):geomSVG(170,110)}</div>`:''}
    ${q.reason?`<div class="reason">${q.flag?'⚠️ ':''}${q.reason}</div>`:''}
    <div class="q-foot">
      <button class="btn mini" data-act="ans">展开答案与解析</button>
      <button class="btn mini" data-act="swap">换一道</button>
      <button class="btn mini" data-act="redo">只重做这题</button>
      ${q.flag?`<button class="btn mini" data-act="ok">我确认</button>`:''}
    </div>
    <div class="ans">
      <h4>答案</h4><div>${q.ans}</div>
      <h4 style="margin-top:7px">解析</h4>
      <ol>${q.sol.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>
  </div>`;
}

function flowHTML(){

function render(){
  document.getElementById('flow').innerHTML = flowHTML();

  document.getElementById('verLabel').textContent = VER;
  const nFlag = currentQS().filter(q=>q.flag).length;
  document.getElementById('flagFilter').textContent = `只看待复核 (${nFlag})`;
  document.getElementById('flagFilter').style.borderColor = onlyFlag? 'var(--accent)':'';
  document.getElementById('flagFilter').style.color = onlyFlag? 'var(--accent)':'';
  const stage=document.getElementById('stage');
  stage.innerHTML = TAB==='paper'?paperHTML(): TAB==='net'?netHTML():evHTML();
  document.querySelectorAll('#verSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===VER));
  document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB));
}

/* 交互 */
document.getElementById('verSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; VER=b.dataset.v; render();
});
document.querySelector('.tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return; TAB=b.dataset.tab; render();
});
document.getElementById('flagFilter').addEventListener('click', ()=>{ onlyFlag=!onlyFlag; render(); });
document.getElementById('stage').addEventListener('click', e=>{
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const card=btn.closest('.q'); const no=card.dataset.no;
  if(btn.dataset.act==='ans'){ card.querySelector('.ans').classList.toggle('open');
    btn.textContent = card.querySelector('.ans').classList.contains('open')?'收起答案与解析':'展开答案与解析'; }
  else{
    const t={swap:`第 ${no} 题换一道`,redo:`只重做第 ${no} 题`,ok:`第 ${no} 题我确认`}[btn.dataset.act];
    const flow=document.getElementById('flow');
    const div=document.createElement('div');
    div.className='msg user'; div.style.marginTop='14px';
    div.innerHTML=`<span class="av">师</span><div class="bub">${t}</div>`;
    flow.appendChild(div); flow.scrollTop=flow.scrollHeight;
  }
});
render();
