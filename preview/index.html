<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════
  布局预览 —— 项目的【视觉契约】，不是前端实现。

  配方全部照抄 DeepSeek Harness，出处写在这里，改之前先去看原件：
    · 令牌          dsh-client-ui-theme/lib/client.js        （--dsw-*）
    · 气泡 / 侧栏    dsh-client-ui-chat/lib/client.js         （.Sixlwa_* / .lcKema_* / .xzv4MW_*）
    · 代码块        --dsl-*-radius: 12px、行高 22px、顶标 11px/18px
    · 正文 14/24，次级 13/20，说明 12，等宽 22；圆角 6（行）/8（控件）/12（代码块）/22（气泡）

  后续 agent 请遵守：
    1. 只改样式与布局，不加解释性文字（less is more）。
    2. 状态与过程分离：行内一个状态词；过程写人话放详情。不用符号代替词、不暴露内部术语。
    3. 色值/间距/字号一律走 :root 变量；**找不到配方就去上面两个包翻，不要凭印象猜**。
  详见 docs/agent/06-决策与红线.md ADR-0015。
  ══════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命题组 · 布局预览</title>
<style>
  :root{
    --label-1:#0f1115; --label-2:#43454a; --label-3:#81858c; --label-4:#adb2b8;
    --bg:#fff; --bg-module:#f5f6f7; --bg-hover:#2631480f; --bg-active:#2631481a; --bg-overlay:#e9ecf2;
    --sidebar:#f9fafb; --sidebar-active:#f5f5f5;
    --line-1:rgb(0 0 0 / 4%); --line-2:rgb(0 0 0 / 10%);
    --st-business:#4176e6; --st-success:#22c55e; --st-success-strong:#16a34a;
    --st-warn:#dd8629; --st-error:#dc2626; --st-warn-bg:#fef5e7;
    --bubble:#edf3fe;
    --font:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --fs-cap:12px; --fs-sm:13px; --fs-base:14px; --fs-lg:16px; --fs-title:20px;
    --lh-base:24px; --lh-sm:20px; --lh-code:22px;
    --r-row:6px; --r-ctl:8px; --r-code:12px; --r-bubble:22px;
    --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:10px; --sp-5:12px; --sp-6:16px; --sp-7:24px;
    --content:748px;
  }
  html[data-theme=dark]{
    --label-1:#e9ecf2; --label-2:#adb2b8; --label-3:#81858c; --label-4:#65676b;
    --bg:#151517; --bg-module:#232324; --bg-hover:#ffffff0f; --bg-active:#ffffff1a; --bg-overlay:#2c2c2e;
    --sidebar:#1b1b1c; --sidebar-active:#232324;
    --line-1:rgb(255 255 255 / 6%); --line-2:rgb(255 255 255 / 12%);
    --st-success-strong:#3aa76d; --st-warn-bg:#2a2418; --bubble:#2c2c2e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--label-1);font:var(--fs-base)/var(--lh-base) var(--font)}
  .cap{font-size:var(--fs-cap);color:var(--label-3)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  svg{display:block}
  button{font-family:inherit}

  /* ── 顶栏 ── */
  .top{height:48px;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-6);
       border-bottom:1px solid var(--line-1)}
  .brand{font-size:var(--fs-base);font-weight:600}
  .brand span{font-weight:400;font-size:var(--fs-cap);color:var(--label-4);margin-left:var(--sp-2)}
  .title{font-size:var(--fs-sm);color:var(--label-2);padding-left:var(--sp-5);border-left:1px solid var(--line-2)}
  .meta{margin-left:auto;display:flex;align-items:center;gap:var(--sp-5);font-size:var(--fs-cap);color:var(--label-3)}
  .meta b{font-weight:400;color:var(--label-2)}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden}
  .seg b{font-size:var(--fs-cap);font-weight:400;color:var(--label-3);padding:5px 10px;cursor:pointer}
  .seg b+b{border-left:1px solid var(--line-2)}
  .seg b.on{background:var(--label-1);color:var(--bg)}
  .ibtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;
        background:none;border-radius:30px;color:var(--label-3);cursor:pointer}
  .ibtn:hover{background:var(--bg-hover);color:var(--label-1)}
  .pri{border:0;background:var(--label-1);color:var(--bg);font-size:var(--fs-sm);font-weight:500;
       padding:7px 14px;border-radius:var(--r-ctl);cursor:pointer}
  .send{width:30px;height:30px;flex:0 0 30px;display:inline-flex;align-items:center;justify-content:center;
        border:0;border-radius:30px;background:var(--label-1);color:var(--bg);cursor:pointer}

  /* ── 三栏 ── */
  .shell{display:grid;grid-template-columns:216px 1fr 1.15fr;height:calc(100vh - 48px)}
  .col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line-1)}
  .col.side{background:var(--sidebar)}
  .col:last-child{border-right:0;background:var(--bg-module)}
  .hd{height:34px;display:flex;align-items:center;padding:0 var(--sp-6);font-size:var(--fs-cap);
      color:var(--label-3);flex:0 0 auto}
  .bd{flex:1;overflow:auto;min-height:0}

  /* ── 侧栏会话 ── */
  .nav{padding:var(--sp-2) var(--sp-3)}
  .row{display:flex;align-items:center;gap:var(--sp-3);padding:7px var(--sp-4);margin:1px 0;border-radius:var(--r-row);
       cursor:pointer;font-size:var(--fs-sm);color:var(--label-2)}
  .row:hover{background:var(--bg-hover)}
  .row.on{background:var(--sidebar-active);color:var(--label-1);font-weight:500}
  .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .s{font-size:var(--fs-cap);color:var(--label-4);font-weight:400}

  /* ── 中栏：transcript ── */
  .tx{max-width:var(--content);margin:0 auto;padding:var(--sp-6) var(--sp-6) 0}
  .turn{margin-bottom:var(--sp-6)}
  .who{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-cap);color:var(--label-4);margin-bottom:var(--sp-3)}
  .who i{width:14px;height:14px;border-radius:50%;background:var(--bg-module);border:1px solid var(--line-2);
         display:inline-block;flex:0 0 14px}
  /* 用户消息：右对齐胶囊气泡（照抄 .Sixlwa_userStack / .Sixlwa_bubble） */
  .turn.user{display:flex;justify-content:flex-end}
  .turn.user .stack{max-width:min(calc(var(--content) * .702), 82%);display:flex;flex-direction:column;align-items:flex-end}
  .bubble{background:var(--bubble);color:var(--label-1);font-size:var(--fs-base);line-height:var(--lh-code);
          border-radius:var(--r-bubble);padding:10px 16px;white-space:pre-wrap;word-break:break-word}

  /* 工作步骤行：图标 + 标题 + 2px 圆点 + 摘要（照抄 .lcKema_*） */
  .step{border-top:1px solid var(--line-1)}
  .step:last-of-type{border-bottom:1px solid var(--line-1)}
  .step>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--sp-3);
                padding:7px var(--sp-3);margin:0 -8px;border-radius:var(--r-row);font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .step>summary::-webkit-details-marker{display:none}
  .step>summary:hover{background:var(--bg-hover)}
  .ico{flex:0 0 16px;height:16px;color:var(--label-3)}
  .ico svg{width:16px;height:16px}
  .step .k{color:var(--label-1);white-space:nowrap}
  .dot{width:2px;height:2px;border-radius:1px;background:var(--label-4);flex:none;margin:0 var(--sp-3)}
  .step .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            color:var(--label-3);font-size:var(--fs-sm)}
  .step .st.ok{color:var(--st-success-strong)} .step .st.warn{color:var(--st-warn)} .step .st.run{color:var(--st-business)}
  .step .act{width:28px;height:28px;flex:0 0 28px;display:none;align-items:center;justify-content:center;
             border:0;background:none;border-radius:28px;color:var(--label-4);cursor:pointer}
  .step>summary:hover .act{display:inline-flex}
  .step .act:hover{background:var(--bg-active);color:var(--label-1)}
  .step .body{padding:var(--sp-1) 0 var(--sp-4) calc(16px + var(--sp-3) + var(--sp-3));
              color:var(--label-3);font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .code{background:var(--bg-module);border-radius:var(--r-code);padding:var(--sp-3) var(--sp-4);
        font:var(--fs-cap)/var(--lh-code) var(--mono);color:var(--label-2)}
  .code b{font-weight:400;color:var(--label-3);display:inline-block;min-width:88px}
  .note{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--label-3);margin-top:var(--sp-3)}
  .note:first-child{margin-top:0}
  .fig{border:1px solid var(--line-1);border-radius:var(--r-ctl);padding:var(--sp-2);
       display:inline-block;background:var(--bg);margin-bottom:var(--sp-3)}

  .cmp{flex:0 0 auto;padding:var(--sp-5) var(--sp-6);border-top:1px solid var(--line-1)}
  .quick{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)}
  .quick button{font-size:var(--fs-cap);color:var(--label-3);background:none;border:1px solid var(--line-2);
                border-radius:var(--r-ctl);padding:4px 10px;cursor:pointer}
  .quick button:hover{background:var(--bg-hover);color:var(--label-1)}
  .in{display:flex;gap:var(--sp-3);align-items:center;border:1px solid var(--line-2);background:var(--bg);
      border-radius:var(--r-code);padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-5)}
  .in:focus-within{border-color:var(--label-4)}
  .in input{flex:1;border:0;outline:0;background:none;font:var(--fs-base)/var(--lh-base) var(--font);color:var(--label-1)}

  /* ── 右栏 ── */
  .tabs{height:36px;display:flex;align-items:center;gap:var(--sp-1);padding:0 var(--sp-6);
        border-bottom:1px solid var(--line-1);background:var(--bg);flex:0 0 auto}
  .tabs button{font-size:var(--fs-sm);color:var(--label-3);background:none;border:0;padding:7px 8px;
               cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--label-1);font-weight:500;border-bottom-color:var(--label-1)}
  .tabs .r{margin-left:auto;font-size:var(--fs-cap);color:var(--label-3);cursor:pointer}
  .pane{padding:var(--sp-7);overflow:auto}
  .sheet{background:var(--bg);border-radius:var(--r-ctl);padding:var(--sp-7) 32px;max-width:820px;margin:0 auto}
  .sheet h1{margin:0;font-size:var(--fs-title);font-weight:600}
  .sheet .sub{display:flex;gap:var(--sp-5);flex-wrap:wrap;margin-top:var(--sp-2);font-size:var(--fs-cap);
              color:var(--label-3);padding-bottom:var(--sp-5);border-bottom:1px solid var(--line-2)}
  /* 题位：左侧等宽题号栏（像代码块的行号槽）+ 正文 + 状态 */
  .q{display:grid;grid-template-columns:26px 1fr auto;column-gap:var(--sp-5);
     padding:var(--sp-6) 0;border-bottom:1px solid var(--line-1)}
  .q:last-child{border-bottom:0}
  .q>.no{grid-column:1;grid-row:1;font:var(--fs-sm)/var(--lh-code) var(--mono);color:var(--label-4);text-align:right}
  .q>.head{grid-column:2;grid-row:1;display:flex;align-items:baseline;gap:var(--sp-4);
           font-size:var(--fs-cap);color:var(--label-3)}
  .q>.head em{font-style:normal;font-size:var(--fs-base);font-weight:600;color:var(--label-1)}
  .q>.st{grid-column:3;grid-row:1;display:inline-flex;align-items:center;gap:var(--sp-2);
         font-size:var(--fs-cap);color:var(--label-3);white-space:nowrap;height:var(--lh-code)}
  .q>.st.ok{color:var(--st-success-strong)} .q>.st.warn{color:var(--st-warn)}
  .q>.st svg{width:13px;height:13px}
  .wide{grid-column:2/-1}
  .stem{font-size:var(--fs-base);line-height:var(--lh-base);margin-top:var(--sp-2)}
  .opts{font-size:var(--fs-base);color:var(--label-2);margin-top:var(--sp-1)}
  .q .fig{margin-top:var(--sp-4)}
  .q .note{color:var(--st-warn)}
  .acts{display:flex;gap:var(--sp-6);margin-top:var(--sp-4)}
  .acts button{font-size:var(--fs-cap);color:var(--label-3);background:none;border:0;padding:0;cursor:pointer}
  .acts button:hover{color:var(--label-1)}
  .ans{display:none;margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px solid var(--line-1);
       font-size:var(--fs-sm);color:var(--label-2)}
  .ans.on{display:block}
  .ans ul{margin:var(--sp-2) 0 0;padding-left:18px}
  .banner{font-size:var(--fs-cap);color:var(--label-2);background:var(--bg-overlay);border-radius:var(--r-ctl);
          padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-6)}

  .card{background:var(--bg);border-radius:var(--r-ctl);padding:var(--sp-7);max-width:820px;margin:0 auto}
  .lg{display:flex;gap:var(--sp-6);font-size:var(--fs-cap);color:var(--label-3);margin:var(--sp-4) 0}
  .lg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:var(--sp-2)}
  .kpi{display:flex;gap:32px;margin:var(--sp-6) 0 var(--sp-5)}
  .kpi div{font-size:var(--fs-cap);color:var(--label-3)}
  .kpi b{display:block;font:600 20px var(--mono);color:var(--label-1)}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  th,td{text-align:left;padding:9px var(--sp-4);border-bottom:1px solid var(--line-1);font-weight:400}
  th{font-size:var(--fs-cap);color:var(--label-3);border-bottom-color:var(--line-2)}
  td.n{font-family:var(--mono);color:var(--label-3)}
  .tag{position:fixed;right:var(--sp-6);bottom:var(--sp-6);font-size:var(--fs-cap);color:var(--label-4)}
  @media (max-width:1080px){.shell{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>

<header class="top">
  <span class="brand">命题组<span>preview</span></span>
  <span class="title">九上 · 第 22 章 二次函数 · 课后作业 <span class="mono" id="ver">v3</span></span>
  <span class="meta">
    <span>一课时 40 分钟</span><span>10 题</span><span>难度 <b class="mono">0.70–0.85</b></span>
    <span>禁用 <b>动点 · 实际问题建模</b></span>
  </span>
  <span class="seg" id="seg"><b data-v="v1">v1</b><b data-v="v2">v2</b><b data-v="v3" class="on">v3</b></span>
  <button class="ibtn" id="theme" title="明暗"></button>
  <button class="pri">定稿导出</button>
</header>

<div class="shell">
  <aside class="col side">
    <div class="hd">会话</div>
    <div class="bd"><div class="nav" id="nav"></div></div>
  </aside>

  <section class="col">
    <div class="hd" style="padding-left:16px">工作记录</div>
    <div class="bd" id="tx"></div>
    <div class="cmp">
      <div class="quick" id="quick"></div>
      <div class="in"><input placeholder="说需求、纠正，或只改某一道题"><button class="send" id="send"></button></div>
    </div>
  </section>

  <section class="col">
    <div class="tabs">
      <button class="on" data-t="paper">卷子</button>
      <button data-t="net">知识网络</button>
      <button data-t="ev">证据</button>
      <span class="r" id="flt">只看待复核</span>
    </div>
    <div class="bd" id="stage"></div>
  </section>
</div>

<div class="tag">布局预览 · 静态示意</div>

<script>
/* ══ 图标（单一线性集，16px，stroke 1.4，随字色）══ */
const P={
 sliders:'<path d="M3 5.5h10M3 10.5h10"/><circle cx="6" cy="5.5" r="1.7"/><circle cx="10" cy="10.5" r="1.7"/>',
 grid:'<rect x="2.8" y="2.8" width="10.4" height="10.4" rx="1.6"/><path d="M2.8 8h10.4M8 2.8v10.4"/>',
 search:'<circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5L13.6 13.6"/>',
 graph:'<circle cx="4" cy="12" r="2.1"/><circle cx="12" cy="4" r="2.1"/><path d="M5.6 10.4l4.8-4.8"/>',
 calc:'<rect x="3.2" y="2.4" width="9.6" height="11.2" rx="1.6"/><path d="M5.8 5.6h4.4M5.8 8.6h1.6M8.8 8.6h1.4M5.8 11.2h1.6M8.8 11.2h1.4"/>',
 image:'<rect x="2.4" y="3.4" width="11.2" height="9.2" rx="1.6"/><path d="M2.4 10.2l3.2-3 2.6 2.6L11 6.6l2.6 2.6"/>',
 upload:'<path d="M8 11.2V3.6M4.8 6.8L8 3.6l3.2 3.2"/><path d="M3 12.4h10"/>',
 chart:'<path d="M3.4 12.6V8.4M7 12.6V3.8M10.6 12.6V9.4M14 12.6V6.2"/>',
 refresh:'<path d="M13.2 8a5.2 5.2 0 1 1-1.7-3.9"/><path d="M13.4 2.8v2.8h-2.8"/>',
 check:'<path d="M3.4 8.4l3 3 6.2-6.8"/>',
 alert:'<path d="M8 3.2l5.6 9.6h-11.2z"/><path d="M8 6.8v2.6M8 11.2h.01"/>',
 eye:'<path d="M1.8 8S4.1 4.6 8 4.6 14.2 8 14.2 8 11.9 11.4 8 11.4 1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.7"/>',
 clock:'<circle cx="8" cy="8" r="5.4"/><path d="M8 5v3.3l2 1.2"/>',
 sun:'<circle cx="8" cy="8" r="3"/><path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M3.8 3.8l1 1M11.2 11.2l1 1M12.2 3.8l-1 1M4.8 11.2l-1 1"/>',
 moon:'<path d="M13 9.6A5.6 5.6 0 0 1 6.4 3a5.6 5.6 0 1 0 6.6 6.6z"/>',
 send:'<path d="M8 12.5V3.8M4.6 7.2L8 3.8l3.4 3.4"/>',
 paper:'<path d="M4 2.6h5l3 3v7.8H4z"/><path d="M9 2.6v3h3"/>'
};
const icon=(n,cls="")=>`<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${P[n]||""}</svg>`;

/* ══ 数据（示意）══ */
const VER={
  v1:{note:"初版：10 题到齐，其中 2 题需人工确认。", rep:[], flag:[6,9], ok:[]},
  v2:{note:"已替换第 3 题；第 6 题重做后通过；第 9 题仍需人工确认。", rep:[3], flag:[9], ok:[]},
  v3:{note:"第 9 题已由老师确认，全卷可定稿。", rep:[3], flag:[], ok:[9]},
};
const QS=[
 {n:1,t:"选择",s:3,p:.80,stem:"抛物线 y = x² − 4x + 3 的顶点坐标是（　　）",
  o:["A. (2, −1)","B. (−2, −1)","C. (2, 1)","D. (1, 0)"],a:"A",sol:["配方得 (x − 2)² − 1。","顶点为 (2, −1)。"]},
 {n:2,t:"选择",s:3,p:.78,stem:"二次函数 y = −2(x + 1)² + 3 的开口方向与对称轴分别是（　　）",
  o:["A. 向上，x = 1","B. 向下，x = 1","C. 向上，x = −1","D. 向下，x = −1"],a:"D",sol:["a = −2 < 0，开口向下。","顶点式给出对称轴 x = −1。"]},
 {n:3,t:"选择",s:3,p:.72,fig:"p",stem:"如图，抛物线与 x 轴交于 A、B 两点，则线段 AB 的长为（　　）",
  o:["A. 1","B. 2","C. 3","D. 4"],a:"B",sol:["令 y = 0 得 x = 1 或 3。","AB = 3 − 1 = 2。"]},
 {n:4,t:"选择",s:3,p:.75,stem:"若抛物线的对称轴为 x = 3，则下列一定成立的是（　　）",
  o:["A. a > 0","B. b = −6a","C. c = 0","D. a + b + c = 0"],a:"B",sol:["对称轴 x = −b / (2a) = 3。","故 b = −6a。"]},
 {n:5,t:"选择",s:3,p:.74,stem:"将抛物线 y = x² 先向右平移 2 个单位，再向上平移 1 个单位，所得解析式为（　　）",
  o:["A. y = (x + 2)² + 1","B. y = (x − 2)² + 1","C. y = (x − 2)² − 1","D. y = (x + 2)² − 1"],a:"B",sol:["顶点由 (0, 0) 移到 (2, 1)。","故 y = (x − 2)² + 1。"]},
 {n:6,t:"选择",s:3,p:.70,stem:"二次函数 y = x² − 2x + m 的图象与 x 轴有两个不同交点，则 m 的取值范围是（　　）",
  o:["A. m < 1","B. m > 1","C. m ≤ 1","D. m < −1"],a:"A",sol:["判别式 4 − 4m > 0。","故 m < 1。"],
  note:"题面曾漏写「a > 0」，被符号校验截下；重做 2 次后通过。"},
 {n:7,t:"选择",s:3,p:.73,stem:"当 0 ≤ x ≤ 4 时，二次函数 y = x² − 4x + 3 的最小值为（　　）",
  o:["A. −1","B. 0","C. 3","D. 4"],a:"A",sol:["顶点 x = 2 落在区间内。","最小值为 −1。"]},
 {n:8,t:"选择",s:3,p:.76,stem:"点 A(−1, y₁)、B(3, y₂) 都在抛物线上，则 y₁ 与 y₂ 的大小关系是（　　）",
  o:["A. y₁ > y₂","B. y₁ < y₂","C. y₁ = y₂","D. 无法确定"],a:"C",sol:["对称轴 x = 2，两点到它等距。","故 y₁ = y₂。"]},
 {n:9,t:"解答",s:8,p:.62,fig:"g",stem:"O 为原点，E(3, 1)、F(2.2, 2.2)。求 OE、OF 的长，并比较大小。",
  a:"OE = √10 ≈ 3.162，OF ≈ 3.111，故 OE > OF。",sol:["OE = √(3² + 1²) = √10。","OF = √(2.2² + 2.2²) ≈ 3.111。"],
  note:"图形校验未通过：OE 与 OF 在图上长度过近，易被读成相等，已重绘 2 次。"},
 {n:10,t:"解答",s:8,p:.58,stem:"抛物线经过 A(1, 0)、B(3, 0)，且顶点纵坐标为 −1，求它的解析式。",
  a:"y = x² − 4x + 3",sol:["设 y = a(x − 1)(x − 3)。","顶点 x = 2，代入得 a = 1。"]},
];

const QUICK=["换一道","再补两道解答题","整体降一档","重排顺序","看证据"];

/* ══ 图形 ══ */
function svgP(w,h){
  const x0=-0.6,x1=4.6,y0=-1.6,y1=4.6,pad=12;
  const X=x=>pad+(x-x0)/(x1-x0)*(w-2*pad), Y=y=>h-pad-(y-y0)/(y1-y0)*(h-2*pad);
  let pts=[];for(let i=0;i<=60;i++){const x=x0+(x1-x0)*i/60;pts.push(X(x).toFixed(1)+","+Y(x*x-4*x+3).toFixed(1))}
  return `<svg width="${w}" height="${h}"><line x1="${pad}" y1="${Y(0)}" x2="${w-4}" y2="${Y(0)}" stroke="#adb2b8"/>
   <line x1="${X(0)}" y1="${h-4}" x2="${X(0)}" y2="4" stroke="#adb2b8"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="#4176e6" stroke-width="1.5"/>
   <circle cx="${X(2)}" cy="${Y(-1)}" r="2.2" fill="#0f1115"/>
   <circle cx="${X(1)}" cy="${Y(0)}" r="2" fill="#0f1115"/><circle cx="${X(3)}" cy="${Y(0)}" r="2" fill="#0f1115"/></svg>`;
}
function svgG(w,h){
  const ox=16,oy=h-16,s=24,Pt=(x,y)=>[ox+x*s,oy-y*s];
  const [ex,ey]=Pt(3,1),[fx,fy]=Pt(2.2,2.2);
  return `<svg width="${w}" height="${h}"><line x1="${ox}" y1="${oy}" x2="${w-4}" y2="${oy}" stroke="#adb2b8"/>
   <line x1="${ox}" y1="${oy}" x2="${ox}" y2="4" stroke="#adb2b8"/>
   <line x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="#4176e6" stroke-width="1.5"/>
   <line x1="${ox}" y1="${oy}" x2="${fx}" y2="${fy}" stroke="#dd8629" stroke-width="1.5"/>
   <circle cx="${ex}" cy="${ey}" r="2.2" fill="#4176e6"/><circle cx="${fx}" cy="${fy}" r="2.2" fill="#dd8629"/>
   <circle cx="${ox}" cy="${oy}" r="1.8" fill="#0f1115"/></svg>`;
}

/* ══ 渲染 ══ */
let ver="v3", tab="paper", only=false, dark=false;
const items=()=>QS.map(q=>{
  const o={...q}, V=VER[ver];
  if(q.n===6) o.flag=V.flag.includes(6);
  if(q.n===9){o.flag=V.flag.includes(9); o.ok=V.ok.includes(9)}
  if(q.n===3 && V.rep.includes(3)){o.rep=1;
    o.stem="抛物线与 x 轴交于 A、B，与 y 轴交于 C，则 △ABC 的面积为（　　）";
    o.o=["A. 1","B. 1.5","C. 3","D. 6"]; o.a="C"; o.sol=["C(0, 3)，AB = 2。","S = ½ × 2 × 3 = 3。"]}
  return o;
});
const statusOf=q=>q.flag?{t:"待复核",c:"warn",i:"alert"}:q.ok?{t:"已确认",c:"ok",i:"check"}:
                    q.rep?{t:"已替换",c:"ok",i:"check"}:{t:"通过",c:"",i:"check"};
const stepHTML=s=>`<details class="step" ${s.open?"open":""}>
    <summary>
      <span class="ico">${icon(s.ic)}</span>
      <span class="k">${s.k}</span><span class="dot"></span>
      <span class="st ${s.ok?"ok":s.warn?"warn":s.run?"run":""}">${s.st}</span>
      <button class="act" title="详情">${icon("eye")}</button>
    </summary>
    ${s.d?`<div class="body">${s.d}</div>`:""}</details>`;
const userTurn=t=>`<div class="turn user"><div class="stack"><div class="bubble">${t}</div></div></div>`;
function qHTML(q){
  const s=statusOf(q);
  return `<div class="q">
    <div class="no">${q.n}</div>
    <div class="head"><em>${q.t}</em><span>${q.s} 分</span><span class="mono">难度 ${q.p.toFixed(2)}</span></div>
    <div class="st ${s.c}">${icon(s.i)}${s.t}</div>
    <div class="wide stem">${q.stem}</div>
    ${q.o?`<div class="wide opts">${q.o.join("　")}</div>`:""}
    ${q.fig?`<div class="wide fig">${q.fig==="p"?svgP(150,110):svgG(160,110)}</div>`:""}
    ${q.note?`<div class="wide note">${q.note}</div>`:""}
    <div class="wide acts">
      <button data-a="an">答案与解析</button><button data-a="sw">换一道</button>
      <button data-a="rd">只重做这题</button>${q.flag?`<button data-a="ok">我确认</button>`:""}
    </div>
    <div class="wide ans"><b>答案</b>　${q.a}<ul>${q.sol.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  </div>`;
}
function paper(){
  const L=items().filter(q=>!only||q.flag), V=VER[ver];
  return `<div class="pane"><div class="sheet">
    ${ver!=="v1"?`<div class="banner">${V.note}</div>`:""}
    <h1>二次函数 · 课后作业</h1>
    <div class="sub"><span>初三(2)班</span><span>满分 100 分</span><span>建议 40 分钟</span>
      <span class="mono">${ver}</span><span>共 ${L.length} 题</span></div>
    ${L.map(qHTML).join("")}
  </div></div>`;
}
function net(){
  const N=[["一次函数",60,150,"pre"],["二次函数",190,150,"cov"],["图象",330,70,"cov"],["顶点式",470,70,"cov"],
    ["对称轴",610,70,"cov"],["最值",470,170,"cov"],["交点",330,220,"cov"],["图象平移",610,170,"bare"],
    ["实际问题建模",190,270,"ban"],["动点问题",330,320,"ban"]];
  const E=[[0,1],[1,2],[2,3],[3,4],[3,5],[2,6],[4,7],[1,8],[6,9],[5,9],[4,5]];
  const dot={pre:"#adb2b8",cov:"#4176e6",bare:"#0f1115",ban:"#dd8629"};
  return `<div class="pane"><div class="card">
    <div style="font-size:14px;font-weight:500">本卷覆盖视图</div>
    <div class="lg"><span><i style="background:#4176e6"></i>本卷覆盖</span>
      <span><i style="background:#0f1115"></i>已学未覆盖</span>
      <span><i style="background:#dd8629"></i>未学 · 本卷禁用</span></div>
    <svg viewBox="0 0 700 370" style="width:100%;height:auto">
      ${E.map(([a,b])=>{const t=N[b][3];
        return `<line x1="${N[a][1]}" y1="${N[a][2]}" x2="${N[b][1]}" y2="${N[b][2]}"
          stroke="${t==="ban"?"#dd862955":"#e1e5ee"}" stroke-width="1.2" ${t==="ban"?'stroke-dasharray="4 4"':""}/>`}).join("")}
      ${N.map(n=>`<g><circle cx="${n[1]-46}" cy="${n[2]}" r="4" fill="${dot[n[3]]}"/>
        <text x="${n[1]-34}" y="${n[2]+4}" font-size="12.5" fill="${
          n[3]==="cov"?"#0f1115":n[3]==="ban"?"#dd8629":"#81858c"}">${n[0]}</text></g>`).join("")}
    </svg>
    <div class="kpi"><div><b>5/8</b>知识点覆盖</div><div><b>100%</b>前置闭包</div><div><b>0</b>越界命中</div></div>
    <div class="cap">每次改动后实时更新。</div>
  </div></div>`;
}
function ev(){
  const L=items();

    <div class="kpi"><div><b>10</b>入库题数</div><div><b>5</b>闸门拦截</div><div><b>0.08</b>最高查重</div><div><b>1</b>人工确认</div></div>
    <table><tr><th>题</th><th>符号</th><th>知识边界</th><th>查重</th><th>图形</th><th>状态</th></tr>
      ${L.map(q=>`<tr><td class="n">${q.n}</td><td>通过</td><td>通过</td>

    <div style="height:20px"></div>

      <tr><td class="n">21:07</td><td>生成细目表</td><td>9 个题位</td></tr>

function renderTx(){
  document.getElementById("tx").innerHTML=`<div class="tx">

    ${userTurn("第 3 题太像课本例题了，换一道，其他不动。")}
    ${stepHTML({ic:"refresh",k:"重做 · 第 3 题",st:"通过",ok:1,open:1,

  </div>`;
  document.getElementById("quick").innerHTML=QUICK.map(q=>`<button>${q}</button>`).join("");
  document.getElementById("nav").innerHTML=NAV.map(([t,s,on])=>

function render(){
  document.getElementById("ver").textContent=ver;
  const n=items().filter(q=>q.flag).length;
  document.getElementById("flt").textContent=n?`只看待复核（${n}）`:"只看待复核";
  document.getElementById("flt").style.color=only?"var(--label-1)":"";
  document.getElementById("stage").innerHTML=tab==="paper"?paper():tab==="net"?net():ev();
  document.querySelectorAll("#seg b").forEach(b=>b.classList.toggle("on",b.dataset.v===ver));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.documentElement.dataset.theme=dark?"dark":"light";
  renderTx();
}
document.getElementById("seg").onclick=e=>{const b=e.target.closest("b");if(b){ver=b.dataset.v;render()}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b){tab=b.dataset.t;render()}};
document.getElementById("flt").onclick=()=>{only=!only;render()};
document.getElementById("theme").onclick=()=>{dark=!dark;render()};
document.getElementById("stage").onclick=e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const q=b.closest(".q"), no=q.querySelector(".no").textContent;
  if(b.dataset.a==="an"){q.querySelector(".ans").classList.toggle("on");return}
  const said={sw:`第 ${no} 题换一道`,rd:`只重做第 ${no} 题`,ok:`第 ${no} 题我确认`}[b.dataset.a];
  const d=document.createElement("div");
  d.className="turn user";d.innerHTML=`<div class="stack"><div class="bubble">${said}</div></div>`;
  document.querySelector(".tx").appendChild(d);
};
render();
