<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════
  布局预览 —— 本文件是项目的【视觉契约】，不是前端实现。
  后续 agent 请遵守：
   1. 只改样式与布局，不要往里加解释性文字（less is more）。
   2. 信息层级：一行一个事实；细节一律折叠，不摊在表面上。
   3. 颜色/间距/字号一律走 CSS 变量（:root），不要写死色值。
   4. 风格基线：DeepSeek Harness / Koishi 控制台——紧凑、克制、等宽数字。
  详见 docs/agent/06-决策与红线.md ADR-0015。
  ══════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命题组 · 布局预览</title>
<style>
  :root{
    --bg:#f7f8f9; --panel:#fff; --line:#e8eaed; --line2:#f1f2f4;
    --ink:#1c1f24; --muted:#6b7280; --muted2:#9aa1ac;
    --accent:#4d6bfe; --accent-bg:#eef1ff;
    --ok:#0f9960; --ok-bg:#e9f6f0;
    --warn:#c07a12; --warn-bg:#fdf4e6;
    --bad:#d1493f; --bad-bg:#fdeeec;
    --r:8px; --r-sm:6px;
    --fs:12.5px; --fs-sm:11px; --fs-xs:10.5px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html[data-theme=dark]{
    --bg:#161719; --panel:#1d1e21; --line:#2a2c31; --line2:#24262a;
    --ink:#e7e8ea; --muted:#9aa0a8; --muted2:#6f757e;
    --accent:#6b85ff; --accent-bg:#20243a;
    --ok:#3aa76d; --ok-bg:#1b2a23;
    --warn:#c99a4a; --warn-bg:#2a2418;
    --bad:#d9675e; --bad-bg:#2b1e1d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:var(--fs)/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .dim{color:var(--muted2)}

  /* ── 顶栏 ── */
  .top{height:40px; display:flex; align-items:center; gap:10px; padding:0 10px;
       background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10}
  .brand{display:flex; align-items:center; gap:6px; font-weight:600; font-size:var(--fs)}
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
  .brand em{font-style:normal; font-size:var(--fs-xs); color:var(--muted2); font-weight:400}
  .title{font-size:var(--fs-sm); color:var(--muted); border-left:1px solid var(--line); padding-left:10px}
  .chips{display:flex; gap:4px; margin-left:auto}
  .chip{font-size:var(--fs-xs); color:var(--muted); background:var(--line2); border-radius:4px; padding:2px 6px; white-space:nowrap}
  .chip.no{color:var(--bad); background:var(--bad-bg)}
  .seg{display:flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
  .seg b{border:0;background:none;color:var(--muted);font:inherit;font-size:var(--fs-xs);
         padding:3px 8px;cursor:pointer;font-weight:400}
  .seg b+b{border-left:1px solid var(--line)}
  .seg b.on{background:var(--accent);color:#fff;font-weight:600}
  .ib{width:26px;height:24px;border:1px solid var(--line);background:none;border-radius:var(--r-sm);
      color:var(--muted);cursor:pointer;font-size:12px;line-height:1}
  .ib:hover{color:var(--ink)}
  .pri{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:var(--fs-xs);
       font-weight:600;padding:4px 10px;border-radius:var(--r-sm);cursor:pointer}

  /* ── 三栏 ── */
  .shell{display:grid; grid-template-columns:196px 352px 1fr; height:calc(100vh - 40px)}
  .col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  .col:last-child{border-right:0;background:var(--bg)}
  .hd{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);
      font-size:var(--fs-xs);color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
  .bd{flex:1;overflow:auto;padding:8px}
  .bd.p0{padding:0}

  /* ── 会话 ── */
  .s{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:7px 8px;border-radius:var(--r-sm);
     cursor:pointer;font-size:var(--fs);border:1px solid transparent}
  .s:hover{background:var(--line2)}
  .s.on{background:var(--accent-bg);border-color:var(--accent)}
  .s small{display:block;font-size:var(--fs-xs);color:var(--muted2);font-weight:400}

  /* ── 工作记录 ── */
  .step{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:4px;background:var(--panel);overflow:hidden}
  .step>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:var(--fs-sm)}
  .step>summary::-webkit-details-marker{display:none}
  .step .g{width:14px;text-align:center;color:var(--muted2);flex:0 0 14px;font-size:11px}
  .step .k{font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink);flex:0 0 auto}
  .step .v{color:var(--muted2);font-size:var(--fs-xs);margin-left:auto;text-align:right}
  .step[open]>summary{border-bottom:1px solid var(--line2)}
  .step .d{padding:6px 8px;background:var(--bg);font-size:var(--fs-xs);color:var(--muted)}
  .step .d table{width:100%;border-collapse:collapse}
  .step .d td,.step .d th{padding:2px 4px;text-align:left;border-bottom:1px solid var(--line2);font-weight:400}
  .step .d th{color:var(--muted2)}
  .step.ok .g{color:var(--ok)} .step.no .g{color:var(--warn)} .step.fig .d{display:flex;gap:8px;align-items:center}
  .say{display:flex;gap:7px;margin:10px 0;font-size:var(--fs-sm)}
  .say span{flex:0 0 14px;color:var(--muted2);font-size:11px;text-align:center}
  .say div{background:var(--line2);border-radius:var(--r-sm);padding:5px 8px}

  .cmp{border-top:1px solid var(--line);padding:8px;background:var(--panel)}
  .q{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .q button{font:inherit;font-size:var(--fs-xs);color:var(--muted);background:none;border:1px solid var(--line);
            border-radius:99px;padding:2px 8px;cursor:pointer}
  .q button:hover{border-color:var(--accent);color:var(--accent)}
  .in{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px}
  .in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:var(--fs-sm);color:var(--ink)}

  /* ── 页签 / 卷子 ── */
  .tabs{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);height:30px}
  .tabs button{font:inherit;font-size:var(--fs-xs);color:var(--muted);background:none;border:0;padding:6px 8px;
               cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tabs .r{margin-left:auto;font-size:var(--fs-xs);color:var(--muted2);cursor:pointer}

  .wrap{padding:10px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-width:760px;margin:0 auto}
  .sheet h1{margin:0;font-size:14px;font-weight:650}
  .sheet .meta{font-size:var(--fs-xs);color:var(--muted2);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;
               padding-bottom:8px;border-bottom:1px solid var(--line2)}
  .diff{font-size:var(--fs-xs);color:var(--accent);background:var(--accent-bg);border-radius:var(--r-sm);
        padding:4px 8px;margin-bottom:8px}
  .item{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;margin-bottom:6px}
  .item.flag{border-color:var(--warn);background:var(--warn-bg)}
  .ih{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted2)}
  .ih b{color:var(--ink);font-size:var(--fs);font-weight:650}
  .bdg{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);background:var(--line2);border-radius:4px;padding:1px 5px}
  .bdg.ok{color:var(--ok);background:var(--ok-bg)}
  .bdg.no{color:var(--warn);background:var(--warn-bg)}
  .bdg.ac{color:var(--accent);background:var(--accent-bg)}
  .stem{font-size:13px;line-height:1.7;margin:6px 0 0}
  .opts{font-size:var(--fs-sm);color:var(--muted);margin-top:3px}
  .fg{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;display:inline-block;background:var(--panel)}
  .why{font-size:var(--fs-xs);color:var(--warn);margin-top:6px}
  .acts{display:flex;gap:4px;margin-top:7px}
  .acts button{font:inherit;font-size:var(--fs-xs);color:var(--muted2);background:none;border:0;padding:0 2px;cursor:pointer}
  .acts button:hover{color:var(--accent)}
  .ans{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line2);font-size:var(--fs-sm);color:var(--muted)}
  .ans.on{display:block}
  .ans li{margin-bottom:2px}

  .lg{display:flex;gap:10px;font-size:var(--fs-xs);color:var(--muted2);margin:6px 0}
  .lg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}
  .kpi{display:flex;gap:14px;margin:10px 0 4px;font-size:var(--fs-xs);color:var(--muted2)}
  .kpi b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono)}
  table.t{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
  table.t th,table.t td{border-bottom:1px solid var(--line2);padding:3px 5px;text-align:left;font-weight:400}
  table.t th{color:var(--muted2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .tag{position:fixed;right:10px;bottom:10px;font-size:var(--fs-xs);color:var(--muted2);background:var(--panel);
       border:1px solid var(--line);border-radius:99px;padding:2px 8px}
  @media (max-width:1080px){.shell{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>

<header class="top">
  <span class="brand"><i></i>命题组 <em>preview</em></span>
  <span class="title">九上·22章 二次函数 · 课后作业 <span class="mono" id="ver">v3</span></span>
  <span class="chips">
    <span class="chip">40min</span><span class="chip">10题</span><span class="chip mono">.70–.85</span>
    <span class="chip no">禁用 动点 · 建模</span>
  </span>
  <span class="seg" id="seg"><b data-v="v1">v1</b><b data-v="v2">v2</b><b data-v="v3" class="on">v3</b></span>
  <button class="ib" id="theme" title="主题">◐</button>
  <button class="pri">导出</button>
</header>

<div class="shell">
  <aside class="col">
    <div class="hd">会话</div>
    <div class="bd">
      <div class="s on">课后作业卷 <small>初三(2)班 · 21:07</small></div>
      <div class="s">单元小卷 <small>昨天</small></div>
      <div class="s">周测卷 <small>10-01</small></div>
    </div>
  </aside>

  <section class="col">
    <div class="hd">工作记录</div>
    <div class="bd" id="flow"></div>
    <div class="cmp">
      <div class="q" id="quick"></div>
      <div class="in"><input placeholder="说需求 / 纠正 / 只改某题"><button class="pri">发送</button></div>
    </div>
  </section>

  <section class="col">
    <div class="tabs">
      <button class="on" data-t="paper">卷子</button>
      <button data-t="net">图谱</button>
      <button data-t="ev">证据</button>
      <span class="r" id="flt">待复核 0</span>
    </div>
    <div class="bd p0" id="stage"></div>
  </section>
</div>

<div class="tag">布局预览 · 静态</div>

<script>
/* ── 数据（示意） ── */
const V = {
  v1:{n:"初版 · 2 题待复核", rep:[], flag:[6,9], ok:[]},
  v2:{n:"#3 已替换 · #6 重做通过", rep:[3], flag:[9], ok:[]},
  v3:{n:"#9 人工确认 · 可定稿", rep:[3], flag:[], ok:[9]},
};
const Q = [
 {n:1,t:"选择",s:3,p:.80,d:.06,stem:"抛物线 y = x² − 4x + 3 的顶点坐标是（　　）",
  o:["A. (2, −1)","B. (−2, −1)","C. (2, 1)","D. (1, 0)"],a:"A",sol:["配方：(x−2)² − 1","顶点 (2, −1)"]},
 {n:2,t:"选择",s:3,p:.78,d:.09,stem:"y = −2(x+1)² + 3 的开口方向与对称轴是（　　）",
  o:["A. 上，x=1","B. 下，x=1","C. 上，x=−1","D. 下，x=−1"],a:"D",sol:["a=−2<0 → 向下","对称轴 x=−1"]},
 {n:3,t:"选择",s:3,p:.72,d:.11,fig:"p",stem:"如图，抛物线与 x 轴交于 A、B，则 AB =（　　）",
  o:["A. 1","B. 2","C. 3","D. 4"],a:"B",sol:["y=0 → x=1,3","AB = 2"]},
 {n:4,t:"选择",s:3,p:.75,d:.07,stem:"对称轴为 x = 3，则一定成立的是（　　）",
  o:["A. a>0","B. b=−6a","C. c=0","D. a+b+c=0"],a:"B",sol:["−b/2a = 3"]},
 {n:5,t:"选择",s:3,p:.74,d:.05,stem:"y = x² 右移 2、上移 1 后是（　　）",
  o:["A. (x+2)²+1","B. (x−2)²+1","C. (x−2)²−1","D. (x+2)²−1"],a:"B",sol:["左加右减"]},
 {n:6,t:"选择",s:3,p:.70,d:.08,stem:"y = x² − 2x + m 与 x 轴有两交点，则（　　）",
  o:["A. m<1","B. m>1","C. m≤1","D. m<−1"],a:"A",sol:["Δ = 4 − 4m > 0"],
  why:"回译 ✗：题干漏 a>0 → 自动重做 ×2 后通过"},
 {n:7,t:"选择",s:3,p:.73,d:.10,stem:"0 ≤ x ≤ 4 时 y 的最小值是（　　）",
  o:["A. −1","B. 0","C. 3","D. 4"],a:"A",sol:["顶点 x=2 在区间内"]},
 {n:8,t:"选择",s:3,p:.76,d:.04,stem:"A(−1,y₁)、B(3,y₂) 在抛物线上，则（　　）",
  o:["A. y₁>y₂","B. y₁<y₂","C. y₁=y₂","D. 不定"],a:"C",sol:["对称轴 x=2，两侧等距"]},
 {n:9,t:"解答",s:8,p:.62,d:.07,fig:"g",
  stem:"O 为原点，E(3, 1)、F(2.2, 2.2)。求 OE、OF 并比较。",
  a:"OE=√10≈3.162 > OF≈3.111",sol:["OE=√10","OF=√(2.2²×2)≈3.111"],
  why:"图形 ✗：OE 与 OF 视觉过近 → 重绘 2 次 · 老师已确认"},
 {n:10,t:"解答",s:8,p:.58,d:.09,
  stem:"抛物线过 A(1,0)、B(3,0)，顶点纵坐标 −1，求解析式。",
  a:"y = x² − 4x + 3",sol:["设 a(x−1)(x−3)","顶点 x=2 → a=1"]},
];
const F = [
 {g:"›",k:"约定",v:"22章·第2课时 · 禁用 2"},
 {g:"▤",k:"细目表",v:"9 位 · 5 知识点", d:`<table><tr><th>知识点</th><th>认知</th><th>题量</th><th>难度</th></tr>
   <tr><td>图象</td><td>理解</td><td>2</td><td class="mono">.78–.80</td></tr>
   <tr><td>顶点式 / 对称轴</td><td>掌握</td><td>3</td><td class="mono">.72–.76</td></tr>
   <tr><td>交点</td><td>掌握</td><td>2</td><td class="mono">.62–.72</td></tr>
   <tr><td>最值</td><td>运用</td><td>1</td><td class="mono">.73</td></tr></table>`},
 {g:"⌕",k:"bank.search",v:"37 命中 · 取 3", d:`<span class="mono">#q1042 .76 / #q2210 .74 / #q3387 .70</span><br>仅对齐风格与难度，不引用原题`},
 {g:"◇",k:"graph.query",v:"前置闭包 ✓", d:`<span class="mono">一次函数 ✓ 配方 ✓ 平移 ✓</span><br><span class="mono">建模 ✗ 已排除</span>`},
 {g:"∑",k:"sympy",v:"构造 ✓", d:`<span class="mono">f = x²−4x+3<br>顶点 (2,−1) ✓ 交点 {1,3} ✓<br>答案由构造产生</span>`},
 {g:"◨",k:"figure.render",v:"数据同源",cls:"fig", open:1, d:`<span class="fg">${svgP(118,88)}</span><span class="mono">标注 = 构造值</span>`},
 {g:"✓",k:"submit #1",v:"全绿",cls:"ok", d:`<table><tr><th>闸门</th><th>判定</th></tr>
   <tr><td>符号</td><td>✓</td></tr><tr><td>边界</td><td>✓</td></tr><tr><td>查重</td><td class="mono">.06</td></tr></table>`},
 {g:"!",k:"submit #6",v:"回译 ✗ → 重做×2 → ✓",cls:"no", open:1,
   d:`<span class="mono">1 漏 a>0 ✗<br>2 干扰项重复 ✗<br>3 ✓ 41s</span>`},
 {g:"▤",k:"拦截",v:"5 次 · 已重做", d:`<span class="mono">超纲 2 · 多解 1 · 图形 2</span>`},
];
const QUICK = ["换一道","补 2 题","降难度","重排","看证据"];

/* ── 图形 ── */
function svgP(w,h){
  const x0=-0.6,x1=4.6,y0=-1.6,y1=4.6,pad=12;
  const X=x=>pad+(x-x0)/(x1-x0)*(w-2*pad), Y=y=>h-pad-(y-y0)/(y1-y0)*(h-2*pad);
  let pts=[];for(let i=0;i<=60;i++){const x=x0+(x1-x0)*i/60;pts.push(X(x).toFixed(1)+","+Y(x*x-4*x+3).toFixed(1))}
  return `<svg width="${w}" height="${h}"><line x1="${pad}" y1="${Y(0)}" x2="${w-3}" y2="${Y(0)}" stroke="#9aa1ac"/>
   <line x1="${X(0)}" y1="${h-3}" x2="${X(0)}" y2="3" stroke="#9aa1ac"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="#4d6bfe" stroke-width="1.4"/>
   <circle cx="${X(2)}" cy="${Y(-1)}" r="2.2" fill="#d1493f"/>
   <circle cx="${X(1)}" cy="${Y(0)}" r="2" fill="#1c1f24"/><circle cx="${X(3)}" cy="${Y(0)}" r="2" fill="#1c1f24"/></svg>`;
}
function svgG(w,h){
  const ox=14,oy=h-14,s=22,P=(x,y)=>[ox+x*s,oy-y*s];
  const [ex,ey]=P(3,1),[fx,fy]=P(2.2,2.2);
  return `<svg width="${w}" height="${h}"><line x1="${ox}" y1="${oy}" x2="${w-4}" y2="${oy}" stroke="#9aa1ac"/>
   <line x1="${ox}" y1="${oy}" x2="${ox}" y2="4" stroke="#9aa1ac"/>
   <line x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="#4d6bfe" stroke-width="1.4"/>
   <line x1="${ox}" y1="${oy}" x2="${fx}" y2="${fy}" stroke="#0f9960" stroke-width="1.4"/>
   <circle cx="${ex}" cy="${ey}" r="2" fill="#4d6bfe"/><circle cx="${fx}" cy="${fy}" r="2" fill="#0f9960"/>
   <circle cx="${ox}" cy="${oy}" r="1.8" fill="#1c1f24"/></svg>`;
}

/* ── 渲染 ── */
let ver="v3", tab="paper", only=false, theme="light";
const items=()=>Q.map(q=>{
  const o={...q};
  if(q.n===6) o.flag=V[ver].flag.includes(6);
  if(q.n===9){o.flag=V[ver].flag.includes(9); o.ok=V[ver].ok.includes(9)}
  if(q.n===3 && V[ver].rep.includes(3)){o.rep=1; o.stem="抛物线与 x 轴交于 A、B，与 y 轴交于 C，则 S△ABC =（　　）";
    o.o=["A. 1","B. 1.5","C. 3","D. 6"];o.a="C";o.sol=["C(0,3)","AB=2 → S=3"]}
  return o;
});
const bd=(t,c)=>`<span class="bdg ${c||''}">${t}</span>`;

function itemHTML(q){
  return `<div class="item ${q.flag?'flag':''}">
    <div class="ih"><b>${q.n}</b><span>${q.t} ${q.s}分</span><span class="mono">p=${q.p.toFixed(2)}</span>
      ${bd("符号 ✓","ok")}${bd("边界 ✓","ok")}${bd("查重 "+q.d.toFixed(2))}${bd("原创 "+Math.round((1-q.d*2)*100)+"%","ac")}
      ${q.fig?bd("图形 ✓","ok"):""}${q.ok?bd("已确认","ok"):""}${q.flag?bd("待复核","no"):""}${q.rep?bd("#3 已替换","ac"):""}
    </div>
    <div class="stem">${q.stem}</div>${q.o?`<div class="opts">${q.o.join("　")}</div>`:""}
    ${q.fig?`<div class="fg">${q.fig==="p"?svgP(132,96):svgG(140,96)}</div>`:""}
    ${q.why?`<div class="why">${q.why}</div>`:""}
    <div class="acts"><button data-a="an">答案</button><button data-a="sw">换一道</button>
      <button data-a="rd">重做</button>${q.flag?`<button data-a="ok">确认</button>`:""}</div>
    <div class="ans"><b>答案</b> ${q.a}<ul>${q.sol.map(s=>`<li>${s}</li>`).join("")}</ul></div>
  </div>`;
}
function paper(){
  const L=items().filter(q=>!only||q.flag), v=V[ver];
  return `<div class="wrap"><div class="sheet">
    ${ver!=="v1"?`<div class="diff">${v.n}</div>`:""}
    <h1>二次函数 · 课后作业</h1>
    <div class="meta"><span>初三(2)班</span><span>100 分</span><span>40min</span><span class="mono">${ver}</span>
      <span>${v.flag.length?`<span style="color:var(--warn)">待复核 ${v.flag.length}</span>`:`<span style="color:var(--ok)">可定稿</span>`}</span></div>
    ${L.map(itemHTML).join("")}
  </div></div>`;
}
function net(){
  const N=[["一次函数",50,150,"pre"],["二次函数",180,150,"cov"],["图象",320,70,"cov"],["顶点式",460,70,"cov"],
    ["对称轴",600,70,"cov"],["最值",460,170,"cov"],["交点",320,220,"cov"],["平移",600,170,"bare"],
    ["建模",180,270,"ban"],["动点",320,320,"ban"]];
  const E=[[0,1],[1,2],[2,3],[3,4],[3,5],[2,6],[4,7],[1,8],[6,9],[5,9],[4,5]];
  const P=Object.fromEntries(N.map(n=>[n[0],[n[1],n[2]]]));
  const st={pre:"#9aa1ac",cov:"#4d6bfe",bare:"#9aa1ac",ban:"#d1493f"};
  const fl={cov:"var(--accent-bg)",ban:"var(--bad-bg)",bare:"var(--panel)",pre:"var(--panel)"};
  return `<div class="wrap"><div class="card">
    <div class="lg"><span><i style="background:var(--accent-bg);border:1.4px solid #4d6bfe"></i>覆盖</span>
      <span><i style="background:var(--panel);border:1px solid #9aa1ac"></i>未覆盖</span>
      <span><i style="background:var(--bad-bg);border:1px dashed #d1493f"></i>禁用</span></div>
    <svg viewBox="0 0 700 370" style="width:100%;height:auto">
      ${E.map(([a,b])=>{const t=N[b][3];return `<line x1="${N[a][1]}" y1="${N[a][2]}" x2="${N[b][1]}" y2="${N[b][2]}"
        stroke="${t==="ban"?"#e3b3ae":"var(--line)"}" stroke-width="1.2" ${t==="ban"?'stroke-dasharray="4 3"':""}/>`}).join("")}
      ${N.map(n=>`<g><rect x="${n[1]-52}" y="${n[2]-13}" rx="7" width="104" height="26"
        fill="${fl[n[3]]}" stroke="${st[n[3]]}" stroke-width="${n[3]==="cov"?1.4:1}" ${n[3]==="ban"?'stroke-dasharray="4 3"':""}/>
        <text x="${n[1]}" y="${n[2]+4}" font-size="11.5" text-anchor="middle"
        fill="${n[3]==="cov"?"var(--accent)":n[3]==="ban"?"var(--bad)":"var(--muted)"}">${n[0]}</text></g>`).join("")}
    </svg>
    <div class="kpi"><span><b>5/8</b>覆盖</span><span><b>100%</b>闭包</span><span><b>0</b>越界</span></div>
  </div></div>`;
}
function ev(){
  const L=items();
  return `<div class="wrap"><div class="card">
    <div class="kpi"><span><b>10</b>入库</span><span><b>5</b>拦截</span><span><b>.08</b>查重峰值</span><span><b>1</b>确认</span></div>
    <table class="t"><tr><th>题</th><th>符号</th><th>边界</th><th>查重</th><th>图形</th><th>状态</th></tr>
      ${L.map(q=>`<tr><td class="mono">${q.n}</td><td>✓</td><td>✓</td><td class="mono">${q.d.toFixed(2)}</td>
        <td>${q.fig?"✓":"—"}</td><td>${q.flag?"待复核":q.ok?"已确认":"通过"}</td></tr>`).join("")}</table>
    <div style="height:14px"></div>
    <table class="t"><tr><th>时间</th><th>动作</th><th>结果</th></tr>
      <tr><td class="mono">21:07</td><td>细目表</td><td>9 位</td></tr>
      <tr><td class="mono">21:09</td><td>submit #6</td><td>回译 ✗</td></tr>
      <tr><td class="mono">21:11</td><td>submit #6</td><td>✓</td></tr>
      <tr><td class="mono">21:14</td><td>确认 #9</td><td>老师</td></tr></table>
  </div></div>`;
}
function flow(){
  return F.map(s=>`<details class="step ${s.cls||""}" ${s.open?"open":""}>
    <summary><span class="g">${s.g}</span><span class="k">${s.k}</span><span class="v">${s.v}</span></summary>
    ${s.d?`<div class="d">${s.d}</div>`:""}</details>`).join("")+
    `<div class="say"><span>师</span><div>#3 太像课本例题，换一道，其他不动。</div></div>
     <details class="step" open><summary><span class="g">↻</span><span class="k">只重做 #3</span>
       <span class="v">v2 → v3 · 其余不动</span></summary></details>`;
}
function render(){
  document.getElementById("flow").innerHTML=flow();
  document.getElementById("quick").innerHTML=QUICK.map(q=>`<button>${q}</button>`).join("");
  document.getElementById("ver").textContent=ver;
  const n=items().filter(q=>q.flag).length;
  document.getElementById("flt").textContent=`待复核 ${n}`;
  document.getElementById("flt").style.color = only?"var(--accent)":"";
  document.getElementById("stage").innerHTML= tab==="paper"?paper(): tab==="net"?net():ev();
  document.querySelectorAll("#seg b").forEach(b=>b.classList.toggle("on",b.dataset.v===ver));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.documentElement.dataset.theme=theme;
}
document.getElementById("seg").onclick=e=>{const b=e.target.closest("b");if(b){ver=b.dataset.v;render()}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b){tab=b.dataset.t;render()}};
document.getElementById("flt").onclick=()=>{only=!only;render()};
document.getElementById("theme").onclick=()=>{theme=theme==="light"?"dark":"light";render()};
document.getElementById("stage").onclick=e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const it=b.closest(".item"), no=it.querySelector("b").textContent;
  if(b.dataset.a==="an"){it.querySelector(".ans").classList.toggle("on");return}
  const t={sw:`#${no} 换一道`,rd:`只重做 #${no}`,ok:`#${no} 确认`}[b.dataset.a];
  const d=document.createElement("div");d.className="say";d.innerHTML=`<span>师</span><div>${t}</div>`;
  const f=document.getElementById("flow");f.appendChild(d);f.scrollTop=f.scrollHeight;
};
render();
</script>
</body>
</html>
