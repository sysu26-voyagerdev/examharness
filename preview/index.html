<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════
  布局预览 —— 项目的【视觉契约】，不是前端实现。

  令牌直接对齐 DeepSeek Harness（见 dsh-client-ui-theme/lib/client.js）：
    · 文字：primary #0f1115 / secondary #43454a / tertiary #81858c / caption #adb2b8
    · 底色：base #fff / module #f5f6f7 / hover #2631480f / overlay #e9ecf2
    · 描边：l1 rgb(0 0 0/4%)  l2 rgb(0 0 0/10%)
    · 正文 14px / 行高 24px；次级 13px；说明 12px；等宽 22px 行高
    · 圆角：控件 8px；工具块与代码块 12px（--dsl-*-radius）
    · 主按钮 = 黑底白字（brand-primary），蓝色只用于"进行中"状态
    · 会话是扁平 transcript：无头像气泡、无右对齐

  后续 agent 请遵守：
    1. 只改样式与布局，不往里加解释性文字（less is more）。
    2. **状态与过程分离**：行内只放一个状态词；过程写成人话放详情。
       不许用符号代替词（✗ ✓ → ×N），不许暴露内部术语（回译/闸门名）。
    3. 色值/间距/字号一律走 :root 变量，不要写死。
    4. 容器不套卡片：分隔用 4% 发丝线，圆角只用 8px（控件）与 12px（代码/工具块）。
  详见 docs/agent/06-决策与红线.md ADR-0015。
  ══════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命题组 · 布局预览</title>
<style>
  :root{
    /* 文字层级（DSH label-*） */
    --label-1:#0f1115; --label-2:#43454a; --label-3:#81858c; --label-4:#adb2b8;
    /* 底色（DSH bg-*） */
    --bg:#fff; --bg-module:#f5f6f7; --bg-hover:#2631480f; --bg-active:#2631481a; --bg-overlay:#e9ecf2;
    /* 描边（DSH border-l1/l2） */
    --line-1:rgb(0 0 0 / 4%); --line-2:rgb(0 0 0 / 10%);
    /* 状态（DSH alias-state-*） */
    --st-business:#4176e6; --st-success:#22c55e; --st-success-strong:#16a34a;
    --st-warn:#dd8629; --st-error:#dc2626; --st-warn-bg:#fef5e7;
    /* 排版 */
    --font:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --fs-caption:12px; --fs-sm:13px; --fs-base:14px; --fs-lg:16px; --fs-title:20px;
    --lh-base:24px; --lh-code:22px;
    /* 尺度 */
    --r-ctl:8px; --r-code:12px;
    --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:10px; --sp-5:12px; --sp-6:16px; --sp-7:24px;
  }
  html[data-theme=dark]{
    --label-1:#e9ecf2; --label-2:#adb2b8; --label-3:#81858c; --label-4:#65676b;
    --bg:#151517; --bg-module:#232324; --bg-hover:#ffffff0f; --bg-active:#ffffff1a; --bg-overlay:#2c2c2e;
    --line-1:rgb(255 255 255 / 6%); --line-2:rgb(255 255 255 / 12%);
    --st-success-strong:#3aa76d; --st-warn-bg:#2a2418;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--label-1);font:var(--fs-base)/var(--lh-base) var(--font)}
  .cap{font-size:var(--fs-caption);color:var(--label-3)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}

  /* ── 顶栏 ── */
  .top{height:48px;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-6);
       border-bottom:1px solid var(--line-1)}
  .brand{font-size:var(--fs-base);font-weight:600}
  .brand span{font-weight:400;font-size:var(--fs-caption);color:var(--label-4);margin-left:var(--sp-2)}
  .title{font-size:var(--fs-sm);color:var(--label-2);padding-left:var(--sp-5);border-left:1px solid var(--line-2)}
  .meta{margin-left:auto;font-size:var(--fs-caption);color:var(--label-3);
        display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap}
  .meta b{font-weight:400;color:var(--label-2)}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden}
  .seg b{font-size:var(--fs-caption);font-weight:400;color:var(--label-3);padding:5px 10px;cursor:pointer}
  .seg b+b{border-left:1px solid var(--line-2)}
  .seg b.on{background:var(--label-1);color:var(--bg)}
  .icon{width:30px;height:30px;border:1px solid var(--line-2);background:none;border-radius:var(--r-ctl);
        color:var(--label-3);cursor:pointer;font-size:var(--fs-sm)}
  .pri{border:0;background:var(--label-1);color:var(--bg);font-size:var(--fs-sm);font-weight:500;
       padding:7px 14px;border-radius:var(--r-ctl);cursor:pointer}

  /* ── 三栏 ── */
  .shell{display:grid;grid-template-columns:212px 1fr 1.15fr;height:calc(100vh - 48px)}
  .col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line-1)}
  .col:last-child{border-right:0;background:var(--bg-module)}
  .hd{height:36px;display:flex;align-items:center;padding:0 var(--sp-5);font-size:var(--fs-caption);
      color:var(--label-3);border-bottom:1px solid var(--line-1);flex:0 0 auto}
  .bd{flex:1;overflow:auto;min-height:0}

  /* ── 会话 ── */
  .row{padding:9px var(--sp-5);cursor:pointer;border-bottom:1px solid var(--line-1)}
  .row:hover{background:var(--bg-hover)}
  .row.on{background:var(--bg-active)}
  .row .t{font-size:var(--fs-sm);color:var(--label-1)}
  .row .s{font-size:var(--fs-caption);color:var(--label-4);margin-top:2px}

  /* ── 中栏：transcript ── */
  .tx{padding:var(--sp-6) var(--sp-6) var(--sp-5);max-width:760px}
  .turn{margin-bottom:var(--sp-5)}
  .who{font-size:var(--fs-caption);color:var(--label-4);margin-bottom:var(--sp-2)}
  .say{background:var(--bg-module);border-radius:var(--r-ctl);padding:10px var(--sp-5);font-size:var(--fs-base)}
  .turn.sys .say{background:none;padding:0}
  .step{border-top:1px solid var(--line-1)}
  .step:last-of-type{border-bottom:1px solid var(--line-1)}
  .step>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:var(--sp-4);
                padding:var(--sp-4) 0;font-size:var(--fs-sm)}
  .step>summary::-webkit-details-marker{display:none}
  .step .k{color:var(--label-1)}
  .step .st{margin-left:auto;font-size:var(--fs-caption);color:var(--label-3);white-space:nowrap}
  .step .st.ok{color:var(--st-success-strong)}
  .step .st.warn{color:var(--st-warn)}
  .step .st.run{color:var(--st-business)}
  .body{margin:0 0 var(--sp-5);background:var(--bg-module);border-radius:var(--r-code);
        padding:var(--sp-4) var(--sp-5);font:var(--fs-caption)/var(--lh-code) var(--mono);color:var(--label-2)}
  .body .note{font-family:var(--font);font-size:var(--fs-caption);color:var(--label-3);
              line-height:1.6;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line-1)}
  .body .note:first-child{margin-top:0;padding-top:0;border-top:0}
  .body .hit{display:flex;gap:var(--sp-4)}
  .body .hit i{font-style:normal;color:var(--label-4)}
  .fig{border:1px solid var(--line-1);border-radius:var(--r-ctl);padding:var(--sp-2);
       display:inline-block;background:var(--bg);margin-bottom:var(--sp-3)}

  /* 输入区 */
  .cmp{flex:0 0 auto;padding:var(--sp-5) var(--sp-6);border-top:1px solid var(--line-1)}
  .quick{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)}
  .quick button{font-size:var(--fs-caption);color:var(--label-3);background:none;border:1px solid var(--line-2);
                border-radius:var(--r-ctl);padding:4px 10px;cursor:pointer}
  .quick button:hover{background:var(--bg-hover);color:var(--label-1)}
  .in{display:flex;gap:var(--sp-3);align-items:center;border:1px solid var(--line-2);
      border-radius:var(--r-ctl);padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-5)}
  .in:focus-within{border-color:var(--label-3)}
  .in input{flex:1;border:0;outline:0;background:none;font:var(--fs-base)/var(--lh-base) var(--font);color:var(--label-1)}

  /* ── 右栏 ── */
  .tabs{height:36px;display:flex;align-items:center;gap:var(--sp-1);padding:0 var(--sp-5);
        border-bottom:1px solid var(--line-1);background:var(--bg);flex:0 0 auto}
  .tabs button{font-size:var(--fs-sm);color:var(--label-3);background:none;border:0;padding:7px 8px;
               cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--label-1);font-weight:500;border-bottom-color:var(--label-1)}
  .tabs .r{margin-left:auto;font-size:var(--fs-caption);color:var(--label-3);cursor:pointer}
  .pane{padding:var(--sp-7);overflow:auto}
  .sheet{background:var(--bg);border-radius:var(--r-ctl);padding:var(--sp-7) 32px;max-width:820px;margin:0 auto}
  .sheet h1{margin:0;font-size:var(--fs-title);font-weight:600;letter-spacing:.2px}
  .sheet .sub{display:flex;gap:var(--sp-5);flex-wrap:wrap;margin-top:var(--sp-2);
              font-size:var(--fs-caption);color:var(--label-3);padding-bottom:var(--sp-5);
              border-bottom:1px solid var(--line-2)}
  .q{padding:var(--sp-6) 0;border-bottom:1px solid var(--line-1);display:grid;
     grid-template-columns:1fr auto;gap:0 var(--sp-6)}
  .q:last-child{border-bottom:0;padding-bottom:var(--sp-3)}
  .q .head{display:flex;align-items:baseline;gap:var(--sp-4);font-size:var(--fs-caption);color:var(--label-3)}
  .q .head b{font-size:var(--fs-base);font-weight:600;color:var(--label-1)}
  .q .status{font-size:var(--fs-caption);color:var(--label-3);text-align:right;white-space:nowrap}
  .q .status.ok{color:var(--st-success-strong)}
  .q .status.warn{color:var(--st-warn)}
  .q .stem{grid-column:1/-1;font-size:var(--fs-base);line-height:var(--lh-base);margin-top:var(--sp-3)}
  .q .opts{grid-column:1/-1;font-size:var(--fs-base);color:var(--label-2);margin-top:var(--sp-1)}
  .q .fig{grid-column:1/-1;margin-top:var(--sp-4)}
  .q .note{grid-column:1/-1;font-size:var(--fs-caption);color:var(--st-warn);margin-top:var(--sp-3)}
  .q .acts{grid-column:1/-1;display:flex;gap:var(--sp-6);margin-top:var(--sp-4)}
  .q .acts button{font-size:var(--fs-caption);color:var(--label-3);background:none;border:0;padding:0;cursor:pointer}
  .q .acts button:hover{color:var(--label-1)}
  .q .ans{grid-column:1/-1;display:none;margin-top:var(--sp-5);padding-top:var(--sp-4);
          border-top:1px solid var(--line-1);font-size:var(--fs-sm);color:var(--label-2)}
  .q .ans.on{display:block}
  .q .ans ul{margin:var(--sp-2) 0 0;padding-left:18px}
  .banner{font-size:var(--fs-caption);color:var(--label-2);background:var(--bg-overlay);
          border-radius:var(--r-ctl);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-6)}

  /* 图谱 / 证据 */
  .card{background:var(--bg);border-radius:var(--r-ctl);padding:var(--sp-7);max-width:820px;margin:0 auto}
  .lg{display:flex;gap:var(--sp-6);font-size:var(--fs-caption);color:var(--label-3);margin:var(--sp-4) 0}
  .lg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:var(--sp-2)}
  .kpi{display:flex;gap:32px;margin:var(--sp-6) 0 var(--sp-5)}
  .kpi div{font-size:var(--fs-caption);color:var(--label-3)}
  .kpi b{display:block;font:600 20px var(--mono);color:var(--label-1)}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  th,td{text-align:left;padding:9px var(--sp-4);border-bottom:1px solid var(--line-1);font-weight:400}
  th{font-size:var(--fs-caption);color:var(--label-3);border-bottom-color:var(--line-2)}
  td.n{font-family:var(--mono);color:var(--label-3)}
  .tag{position:fixed;right:var(--sp-6);bottom:var(--sp-6);font-size:var(--fs-caption);color:var(--label-4)}
  @media (max-width:1080px){.shell{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>

<header class="top">
  <span class="brand">命题组<span>preview</span></span>
  <span class="title">九上 · 第 22 章 二次函数 · 课后作业 <span class="mono" id="ver">v3</span></span>
  <span class="meta">
    <span>一课时 40 分钟</span><span>10 题</span><span>难度 <b class="mono">0.70–0.85</b></span>
    <span>禁用 <b>动点 · 实际问题建模</b></span>
  </span>
  <span class="seg" id="seg"><b data-v="v1">v1</b><b data-v="v2">v2</b><b data-v="v3" class="on">v3</b></span>
  <button class="icon" id="theme" title="明暗">◐</button>
  <button class="pri">定稿导出</button>
</header>

<div class="shell">
  <aside class="col">
    <div class="hd">会话</div>
    <div class="bd">
      <div class="row on"><div class="t">课后作业卷</div><div class="s">初三(2)班 · 21:07</div></div>
      <div class="row"><div class="t">单元小卷</div><div class="s">昨天</div></div>
      <div class="row"><div class="t">周测卷</div><div class="s">10-01</div></div>
    </div>
  </aside>

  <section class="col">
    <div class="hd">工作记录</div>
    <div class="bd" id="tx"></div>
    <div class="cmp">
      <div class="quick" id="quick"></div>
      <div class="in"><input placeholder="说需求、纠正，或只改某一道题"><button class="pri">发送</button></div>
    </div>
  </section>

  <section class="col">
    <div class="tabs">
      <button class="on" data-t="paper">卷子</button>
      <button data-t="net">知识网络</button>
      <button data-t="ev">证据</button>
      <span class="r" id="flt">只看待复核</span>
    </div>
    <div class="bd" id="stage"></div>
  </section>
</div>

<div class="tag">布局预览 · 静态示意</div>

<script>
/* ══ 数据（示意）══ */
const VER = {
  v1:{note:"初版：10 题到齐，其中 2 题需人工确认。", rep:[], flag:[6,9], ok:[]},
  v2:{note:"已替换第 3 题；第 6 题重做后通过；第 9 题仍需人工确认。", rep:[3], flag:[9], ok:[]},
  v3:{note:"第 9 题已由老师确认，全卷可定稿。", rep:[3], flag:[], ok:[9]},
};
const QS = [
 {n:1,t:"选择",s:3,p:.80,stem:"抛物线 y = x² − 4x + 3 的顶点坐标是（　　）",
  o:["A. (2, −1)","B. (−2, −1)","C. (2, 1)","D. (1, 0)"],a:"A",sol:["配方得 (x − 2)² − 1。","顶点为 (2, −1)。"]},
 {n:2,t:"选择",s:3,p:.78,stem:"二次函数 y = −2(x + 1)² + 3 的开口方向与对称轴分别是（　　）",
  o:["A. 向上，x = 1","B. 向下，x = 1","C. 向上，x = −1","D. 向下，x = −1"],a:"D",sol:["a = −2 < 0，开口向下。","顶点式给出对称轴 x = −1。"]},
 {n:3,t:"选择",s:3,p:.72,fig:"p",stem:"如图，抛物线与 x 轴交于 A、B 两点，则线段 AB 的长为（　　）",
  o:["A. 1","B. 2","C. 3","D. 4"],a:"B",sol:["令 y = 0 得 x = 1 或 3。","AB = 3 − 1 = 2。"]},
 {n:4,t:"选择",s:3,p:.75,stem:"若抛物线的对称轴为 x = 3，则下列一定成立的是（　　）",
  o:["A. a > 0","B. b = −6a","C. c = 0","D. a + b + c = 0"],a:"B",sol:["对称轴 x = −b / (2a) = 3。","故 b = −6a。"]},
 {n:5,t:"选择",s:3,p:.74,stem:"将抛物线 y = x² 先向右平移 2 个单位，再向上平移 1 个单位，所得解析式为（　　）",
  o:["A. y = (x + 2)² + 1","B. y = (x − 2)² + 1","C. y = (x − 2)² − 1","D. y = (x + 2)² − 1"],a:"B",sol:["顶点由 (0,0) 移到 (2,1)。","故 y = (x − 2)² + 1。"]},
 {n:6,t:"选择",s:3,p:.70,stem:"二次函数 y = x² − 2x + m 的图象与 x 轴有两个不同交点，则 m 的取值范围是（　　）",
  o:["A. m < 1","B. m > 1","C. m ≤ 1","D. m < −1"],a:"A",sol:["判别式 4 − 4m > 0。","故 m < 1。"],
  note:"题面曾漏写「a > 0」，被符号校验截下；重做 2 次后通过。"},
 {n:7,t:"选择",s:3,p:.73,stem:"当 0 ≤ x ≤ 4 时，二次函数 y = x² − 4x + 3 的最小值为（　　）",
  o:["A. −1","B. 0","C. 3","D. 4"],a:"A",sol:["顶点 x = 2 落在区间内。","最小值为 −1。"]},
 {n:8,t:"选择",s:3,p:.76,stem:"点 A(−1, y₁)、B(3, y₂) 都在抛物线上，则 y₁ 与 y₂ 的大小关系是（　　）",
  o:["A. y₁ > y₂","B. y₁ < y₂","C. y₁ = y₂","D. 无法确定"],a:"C",sol:["对称轴 x = 2，两点到它等距。","故 y₁ = y₂。"]},
 {n:9,t:"解答",s:8,p:.62,fig:"g",stem:"O 为原点，E(3, 1)、F(2.2, 2.2)。求 OE、OF 的长，并比较大小。",
  a:"OE = √10 ≈ 3.162，OF ≈ 3.111，故 OE > OF。",sol:["OE = √(3² + 1²) = √10。","OF = √(2.2² + 2.2²) ≈ 3.111。"],
  note:"图形校验未通过：OE 与 OF 在图上长度过近，易被读成相等，已重绘 2 次。"},
 {n:10,t:"解答",s:8,p:.58,stem:"抛物线经过 A(1, 0)、B(3, 0)，且顶点纵坐标为 −1，求它的解析式。",
  a:"y = x² − 4x + 3",sol:["设 y = a(x − 1)(x − 3)。","顶点 x = 2，代入得 a = 1。"]},
];
const FLOW = [
 {k:"读取约定", st:"22章 · 第2课时"},
 {k:"生成细目表", st:"9 个题位",
  d:`<table style="font-size:12px">
      <tr><th>知识点</th><th>认知</th><th>题量</th><th>难度</th></tr>
      <tr><td>图象</td><td>理解</td><td class="n">2</td><td class="n">0.78–0.80</td></tr>
      <tr><td>顶点式与对称轴</td><td>掌握</td><td class="n">3</td><td class="n">0.72–0.76</td></tr>
      <tr><td>与坐标轴交点</td><td>掌握</td><td class="n">2</td><td class="n">0.62–0.72</td></tr>
      <tr><td>最值</td><td>运用</td><td class="n">1</td><td class="n">0.73</td></tr></table>`},
 {k:"检索同类题", st:"37 条",
  d:`<div class="hit"><span>#q1042</span><span>顶点式识别</span><i>难度 0.76</i></div>
     <div class="hit"><span>#q2210</span><span>对称轴与开口</span><i>难度 0.74</i></div>
     <div class="hit"><span>#q3387</span><span>交点与线段长</span><i>难度 0.70</i></div>
     <div class="note">仅用于对齐风格与难度基线，不引用原题。</div>`},
 {k:"知识边界", st:"通过", ok:1,
  d:`<div class="note">所需知识全部落在已学范围内：一次函数、配方、图象平移。</div>`},
 {k:"符号校验", st:"通过", ok:1,
  d:`f(x) = x² − 4x + 3<br>顶点 (2, −1)　与 x 轴交点 (1, 0)、(3, 0)
     <div class="note">答案由构造产生，不由模型生成。</div>`},
 {k:"出图", st:"数据同源",
  d:`<span class="fig">${svgP(140,100)}</span><div class="note">图上的标注值与构造值一致。</div>`},
 {k:"提交 · 第 1 题", st:"通过", ok:1,
  d:`<div class="note">符号校验、知识边界、查重三项均通过。</div>`},
 {k:"提交 · 第 6 题", st:"已重做", warn:1, open:1,
  d:`<div class="note">题面曾漏写「a > 0」，被符号校验截下；重做 2 次后通过。</div>
     <div style="margin-top:8px">第 1 次　漏条件<br>第 2 次　干扰项重复<br>第 3 次　通过</div>`},
 {k:"本卷统计", st:"拦截 5 次",
  d:`<div class="note">其中超纲 2 次、多解 1 次、图形误导 2 次，均已自动重做。</div>`},
];
const QUICK = ["换一道","再补两道解答题","整体降一档","重排顺序","看证据"];

/* ══ 图形 ══ */
function svgP(w,h){
  const x0=-0.6,x1=4.6,y0=-1.6,y1=4.6,pad=12;
  const X=x=>pad+(x-x0)/(x1-x0)*(w-2*pad), Y=y=>h-pad-(y-y0)/(y1-y0)*(h-2*pad);
  let pts=[];for(let i=0;i<=60;i++){const x=x0+(x1-x0)*i/60;pts.push(X(x).toFixed(1)+","+Y(x*x-4*x+3).toFixed(1))}
  return `<svg width="${w}" height="${h}"><line x1="${pad}" y1="${Y(0)}" x2="${w-4}" y2="${Y(0)}" stroke="#adb2b8"/>
   <line x1="${X(0)}" y1="${h-4}" x2="${X(0)}" y2="4" stroke="#adb2b8"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="#4176e6" stroke-width="1.5"/>
   <circle cx="${X(2)}" cy="${Y(-1)}" r="2.2" fill="#0f1115"/>
   <circle cx="${X(1)}" cy="${Y(0)}" r="2" fill="#0f1115"/><circle cx="${X(3)}" cy="${Y(0)}" r="2" fill="#0f1115"/></svg>`;
}
function svgG(w,h){
  const ox=16,oy=h-16,s=24,P=(x,y)=>[ox+x*s,oy-y*s];
  const [ex,ey]=P(3,1),[fx,fy]=P(2.2,2.2);
  return `<svg width="${w}" height="${h}"><line x1="${ox}" y1="${oy}" x2="${w-4}" y2="${oy}" stroke="#adb2b8"/>
   <line x1="${ox}" y1="${oy}" x2="${ox}" y2="4" stroke="#adb2b8"/>
   <line x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="#4176e6" stroke-width="1.5"/>
   <line x1="${ox}" y1="${oy}" x2="${fx}" y2="${fy}" stroke="#dd8629" stroke-width="1.5"/>
   <circle cx="${ex}" cy="${ey}" r="2.2" fill="#4176e6"/><circle cx="${fx}" cy="${fy}" r="2.2" fill="#dd8629"/>
   <circle cx="${ox}" cy="${oy}" r="1.8" fill="#0f1115"/></svg>`;
}

/* ══ 渲染 ══ */
let ver="v3", tab="paper", only=false, dark=false;
const items=()=>QS.map(q=>{
  const o={...q}, V=VER[ver];
  if(q.n===6) o.flag=V.flag.includes(6);
  if(q.n===9){o.flag=V.flag.includes(9); o.ok=V.ok.includes(9)}
  if(q.n===3 && V.rep.includes(3)){o.rep=1;
    o.stem="抛物线与 x 轴交于 A、B，与 y 轴交于 C，则 △ABC 的面积为（　　）";
    o.o=["A. 1","B. 1.5","C. 3","D. 6"]; o.a="C"; o.sol=["C(0, 3)，AB = 2。","S = ½ × 2 × 3 = 3。"]}
  return o;
});
function status(q){
  if(q.flag) return {t:"待复核", c:"warn"};
  if(q.ok)   return {t:"已确认", c:"ok"};
  if(q.rep)  return {t:"已替换", c:"ok"};
  return {t:"通过", c:""};
}
function qHTML(q,i){
  const s=status(q);
  return `<div class="q">
    <div class="head"><b>${q.n}</b><span>${q.t}</span><span>${q.s} 分</span><span class="mono">难度 ${q.p.toFixed(2)}</span></div>
    <div class="status ${s.c}">${s.t}</div>
    <div class="stem">${q.stem}</div>
    ${q.o?`<div class="opts">${q.o.join("　")}</div>`:""}
    ${q.fig?`<div class="fig">${q.fig==="p"?svgP(150,110):svgG(160,110)}</div>`:""}
    ${q.note?`<div class="note">${q.note}</div>`:""}
    <div class="acts">
      <button data-a="an">答案与解析</button><button data-a="sw">换一道</button>
      <button data-a="rd">只重做这题</button>${q.flag?`<button data-a="ok">我确认</button>`:""}
    </div>
    <div class="ans"><b>答案</b>　${q.a}<ul>${q.sol.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  </div>`;
}
function paper(){
  const L=items().filter(q=>!only||q.flag), V=VER[ver];
  return `<div class="pane"><div class="sheet">
    ${ver!=="v1"?`<div class="banner">${V.note}</div>`:""}
    <h1>二次函数 · 课后作业</h1>
    <div class="sub"><span>初三(2)班</span><span>满分 100 分</span><span>建议 40 分钟</span>
      <span class="mono">${ver}</span><span>共 ${L.length} 题</span></div>
    ${L.map(qHTML).join("")}
  </div></div>`;
}
function net(){
  const N=[["一次函数",60,150,"pre"],["二次函数",190,150,"cov"],["图象",330,70,"cov"],["顶点式",470,70,"cov"],
    ["对称轴",610,70,"cov"],["最值",470,170,"cov"],["交点",330,220,"cov"],["图象平移",610,170,"bare"],
    ["实际问题建模",190,270,"ban"],["动点问题",330,320,"ban"]];
  const E=[[0,1],[1,2],[2,3],[3,4],[3,5],[2,6],[4,7],[1,8],[6,9],[5,9],[4,5]];
  const dot={pre:"#adb2b8",cov:"#4176e6",bare:"#0f1115",ban:"#dd8629"};
  return `<div class="pane"><div class="card">
    <div style="font-size:14px;font-weight:500">本卷覆盖视图</div>
    <div class="lg"><span><i style="background:#4176e6"></i>本卷覆盖</span>
      <span><i style="background:#0f1115"></i>已学未覆盖</span>
      <span><i style="background:#dd8629"></i>未学 · 本卷禁用</span></div>
    <svg viewBox="0 0 700 370" style="width:100%;height:auto">
      ${E.map(([a,b])=>{const t=N[b][3];
        return `<line x1="${N[a][1]}" y1="${N[a][2]}" x2="${N[b][1]}" y2="${N[b][2]}"
          stroke="${t==="ban"?"#dd862955":"#e1e5ee"}" stroke-width="1.2" ${t==="ban"?'stroke-dasharray="4 4"':""}/>`}).join("")}
      ${N.map(n=>`<g>
        <circle cx="${n[1]-46}" cy="${n[2]}" r="4" fill="${dot[n[3]]}"/>
        <text x="${n[1]-34}" y="${n[2]+4}" font-size="12.5" fill="${
          n[3]==="cov"?"#0f1115":n[3]==="ban"?"#dd8629":"#81858c"}">${n[0]}</text></g>`).join("")}
    </svg>
    <div class="kpi"><div><b>5/8</b>知识点覆盖</div><div><b>100%</b>前置闭包</div><div><b>0</b>越界命中</div></div>
    <div class="cap">每次改动后实时更新。</div>
  </div></div>`;
}
function ev(){
  const L=items();
  return `<div class="pane"><div class="card">
    <div class="kpi"><div><b>10</b>入库题数</div><div><b>5</b>闸门拦截</div><div><b>0.08</b>最高查重</div><div><b>1</b>人工确认</div></div>
    <table><tr><th>题</th><th>符号</th><th>知识边界</th><th>查重</th><th>图形</th><th>状态</th></tr>
      ${L.map(q=>`<tr><td class="n">${q.n}</td><td>通过</td><td>通过</td><td class="n">0.${String(Math.round(q.p*10)).padStart(2,"0")}</td>
        <td>${q.fig?"通过":"—"}</td><td>${status(q).t}</td></tr>`).join("")}</table>
    <div style="height:20px"></div>
    <table><tr><th>时间</th><th>动作</th><th>结果</th></tr>
      <tr><td class="n">21:07</td><td>生成细目表</td><td>9 个题位</td></tr>
      <tr><td class="n">21:09</td><td>提交第 6 题</td><td>漏条件，被截下</td></tr>
      <tr><td class="n">21:11</td><td>提交第 6 题</td><td>通过</td></tr>
      <tr><td class="n">21:14</td><td>确认第 9 题</td><td>老师</td></tr></table>
  </div></div>`;
}
const stepHTML=s=>`<details class="step" ${s.open?"open":""}>
    <summary><span class="k">${s.k}</span><span class="st ${s.ok?"ok":s.warn?"warn":s.run?"run":""}">${s.st}</span></summary>
    ${s.d?`<div class="body">${s.d}</div>`:""}</details>`;
const userTurn=t=>`<div class="turn"><div class="who">你</div><div class="say">${t}</div></div>`;
function renderTx(){
  document.getElementById("tx").innerHTML=`<div class="tx">
    ${userTurn("出今天的课后作业卷：一课时、40 分钟、10 题，难度偏易；本课时没讲动点和实际问题建模，别出。")}
    <div class="turn sys"><div class="who">命题组</div>${FLOW.map(stepHTML).join("")}</div>
    ${userTurn("第 3 题太像课本例题了，换一道，其他不动。")}
    ${stepHTML({k:"重做 · 第 3 题", st:"通过", ok:1, open:1,
      d:`<div class="note">只重做第 3 题，其余 9 题与蓝图保持不变。</div>`})}
  </div>`;
  document.getElementById("quick").innerHTML=QUICK.map(q=>`<button>${q}</button>`).join("");
}
function render(){
  document.getElementById("ver").textContent=ver;
  const n=items().filter(q=>q.flag).length;
  document.getElementById("flt").textContent=n?`只看待复核（${n}）`:"只看待复核";
  document.getElementById("flt").style.color=only?"var(--label-1)":"";
  document.getElementById("stage").innerHTML=tab==="paper"?paper():tab==="net"?net():ev();
  document.querySelectorAll("#seg b").forEach(b=>b.classList.toggle("on",b.dataset.v===ver));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.documentElement.dataset.theme=dark?"dark":"light";
  renderTx();
}
document.getElementById("seg").onclick=e=>{const b=e.target.closest("b");if(b){ver=b.dataset.v;render()}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b){tab=b.dataset.t;render()}};
document.getElementById("flt").onclick=()=>{only=!only;render()};
document.getElementById("theme").onclick=()=>{dark=!dark;render()};
document.getElementById("stage").onclick=e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const q=b.closest(".q"), no=q.querySelector(".head b").textContent;
  if(b.dataset.a==="an"){q.querySelector(".ans").classList.toggle("on");return}
  const said={sw:`第 ${no} 题换一道`,rd:`只重做第 ${no} 题`,ok:`第 ${no} 题我确认`}[b.dataset.a];
  const d=document.createElement("div");
  d.className="turn";d.innerHTML=`<div class="who">你</div><div class="say">${said}</div>`;
  document.querySelector(".tx").appendChild(d);
};
render();
</script>
</body>
</html>
