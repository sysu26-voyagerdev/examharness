# 命题组 · 组合根
# 设置覆盖层：设置页改的就是它（data/settings.json），密钥永不落盘
- id: settings
  name: '@examharness/plugin-settings'
  config:
    path: data/settings.json
    # 凭据文件：0600，只存密钥值；配置里只放**引用名**（密钥永不进设置文档）
    credentials: data/credentials.json
    modelBaseUrl: ${EXAMHARNESS_BASE_URL}
    modelName: ${EXAMHARNESS_MODEL}
    modelApiKeyEnv: EXAMHARNESS_API_KEY
    websearchEnabled: false
    websearchEndpoint: ''
    corpusDirs:
      - corpus/questions
      - corpus/textbooks
      - corpus/extracted
    defaultClassName: 初三(2)班
    defaultProgress: 九上·22章·第2课时
    defaultBlueprint: seed/blueprint.json
    corpusWordingMax: 0.55
    corpusNumbersMin: 0.8
    bankMaxSimilarity: 0.85

#
# 一行 = 一个插件。老师改题型、难度、禁用清单都在这里改，不用碰代码；
# 开发时配合 HMR 可以现场热重载（docs/agent/02-架构与仓库结构.md）。
#
# 顺序即挂载顺序；依赖由各插件的 inject 声明，不靠这里的先后。

- id: graph
  name: '@examharness/plugin-graph'
  config:
    path: seed/knowledge.json
    # 追加知识点清单（课标/教材目录整理件，可放多份）
    paths: []
    # 已学集合：不在其中的前置知识 = 超纲（本卷只讲到「最值」）
    learned:
      - 一次函数
      - 配方
      - 图象平移
      - 二次函数图象
      - 顶点式
      - 对称轴
      - 与坐标轴交点
      - 最值

# 语料库：真实题库/教材整理件（corpus/ 不进 Git）。缺目录也不影响启动。
- id: corpus
  name: '@examharness/plugin-corpus'
  config:
    # 语料目录默认**空的**：没有真资料就没有语料，
    # 别拿编的"真题"充数（那会让原创度凭据变成假的）。老师在「资料」页上传真资料即可。
    dirs:
      - corpus/questions
      - corpus/textbooks
      - corpus/extracted
    minLength: 8
    maxSimilarity: 0.6

- id: bank
  name: '@examharness/plugin-bank'
  config:
    path: data/bank.jsonl

# ── 闸门链（每个闸门一个包，可单独开关）──
- id: verify-scope
  name: '@examharness/plugin-verify-scope'
  config:
    forbid:
      - 实际问题建模
      - 动点问题

- id: verify-symbolic
  name: '@examharness/plugin-verify-symbolic'
  config:
    tolerance: 1.0e-9

- id: verify-dedup
  name: '@examharness/plugin-verify-dedup'
  config:
    maxSimilarity: 0.85
    corpusWordingMax: 0.55
    corpusNumbersMin: 0.8

- id: construct
  name: '@examharness/plugin-construct-parabola'
  config:
    rootRange: [-4, 5]

- id: verify-roundtrip
  name: '@examharness/plugin-verify-roundtrip'
  config:
    strict: true

- id: verify-figure
  name: '@examharness/plugin-verify-figure'
  config:
    requireFigure: false

- id: figure
  name: '@examharness/plugin-figure'
  config:
    width: 480
    height: 300
    minPointGapPx: 14

- id: paper
  name: '@examharness/plugin-paper'
  config:
    maxAttempts: 6

- id: llm
  name: '@examharness/plugin-llm'
  config:
    # 密钥走环境变量：EXAMHARNESS_API_KEY / EXAMHARNESS_BASE_URL / EXAMHARNESS_MODEL
    baseUrl: ${EXAMHARNESS_BASE_URL}
    apiKey: ${EXAMHARNESS_API_KEY}
    model: ${EXAMHARNESS_MODEL}
    temperature: 0.2

# 联网搜索：**可配置的引导工具**，默认关闭。
# 它是引导不是闸门——网上既有素材也有别人出过的题，后者只有查重闸门拦得住。
- id: websearch
  name: '@examharness/plugin-websearch'
  config:
    enabled: false
    endpoint: ''
    apiKey: ${EXAMHARNESS_SEARCH_KEY}
    limit: 5
    timeoutMs: 15000

# 知识库：上传暂存 + 整理状态（整理由 agent 干，见知识库页）
# 原料落在 data/kb/uploads（**不进语料**）；agent 抽出来的题落在 corpus/extracted（被语料扫描）
- id: kb
  name: '@examharness/plugin-kb'
  config:
    dir: data/kb/uploads
    extractDir: corpus/extracted
    index: data/kb.json
    maxTextBytes: 5242880

# 工作区：agent 的手脚（in/ 原件 · tmp/ 脚本 · out/ 产物）。
# **不是沙箱**（ADR-0020）：跑的是本机 python；边界是「白名单 + 不许内联代码 + 不许工作区外路径 + 超时」。
# 装包默认关闭（allowInstall: false）：装什么是人的决定，不是 agent 的决定。
- id: workspace
  name: '@examharness/plugin-workspace'
  config:
    dir: data/workspaces
    venv: .venv
    allowInstall: false
    # 装了就能用：压缩包在工作区里解开再读（apt install p7zip-full unrar-free）
    allow:
      - python3
      - python
      - node
      - pdftotext
      - tesseract
      - ls
      - cat
      - head
      - tail
      - wc
      - grep
      - sort
      - uniq
      - cut
      - iconv
      - file
      - cp
      - mv
      - mkdir
      - find
      - unzip
      - tar
      - gunzip
      - 7z
      - 7za
      - unrar
    timeoutMs: 60000
    maxOutputBytes: 20000

# 文档与 OCR：PDF / Word / Excel / 图片 一次读成文字（工具给模型用，不是让模型现写脚本）
# 语言包：pnpm ocr:lang（下到 data/tessdata，不需要 sudo）
- id: doc
  name: '@examharness/plugin-doc'
  config:
    script: scripts/extract.py
    maxChars: 20000
    timeoutMs: 240000

# 会话与卷子版本：多会话、版本、diff、局部重做、人工确认、冻结
- id: session
  name: '@examharness/plugin-session'
  config:
    path: data/sessions.json
    logPath: data/session-log.json
    defaultBlueprint: seed/blueprint.json
    defaultClass: 初三(2)班
    defaultProgress: 九上·22章·第2课时

# agent 工作台：没有步数上限——停下来的是模型自己，或者老师按停（ADR-0006）
- id: workbench
  name: '@examharness/plugin-workbench'
  config:
    extraRules: ''

- id: web
  name: '@examharness/plugin-web'
  config:
    port: 8787
