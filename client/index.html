<!DOCTYPE html>
<!--
  调试台（**不是**视觉契约）。
  视觉契约在 preview/index.html；这里只要能看清「闸门到底拦了什么」。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命题组 · 调试台</title>
<style>
  :root{ --ink:#0f1115; --muted:#81858c; --line:rgb(0 0 0 / 10%); --bg:#f5f6f7 }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif}
  header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline}
  header b{font-weight:600}
  header span{color:var(--muted);font-size:12px}
  main{padding:20px;max-width:1080px;margin:0 auto}
  h2{font-size:13px;font-weight:500;color:var(--muted);margin:24px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:400;font-size:12px}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#43454a}
  button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);background:#fff;
         border-radius:8px;cursor:pointer}
  button:hover{background:var(--bg)}
  #log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#43454a;
       background:var(--bg);border-radius:12px;padding:10px 12px;max-height:280px;overflow:auto;white-space:pre-wrap}
  .ok{color:#16a34a} .no{color:#dd8629}
</style>
</head>
<body>
<header>
  <b>命题组 · 调试台</b>
  <span>闸门链 = 唯一写入口；被拦下的题不会落盘</span>
  <button id="run" style="margin-left:auto">跑一次命题组</button>
  <button id="assemble">按蓝图组卷</button>
</header>
<main>
  <h2>命题蓝图</h2>
  <table id="blueprint"><thead>
    <tr><th>题位</th><th>知识点</th><th>认知</th><th>题型</th><th>分值</th><th></th></tr>
  </thead><tbody></tbody></table>

  <h2>已入库</h2>
  <table id="items"><thead>
    <tr><th>id</th><th>题位</th><th>题干</th><th>答案</th><th>证据</th><th>状态</th></tr>
  </thead><tbody></tbody></table>

  <h2>卷子（由易到难）</h2>
  <table id="paper"><thead>
    <tr><th>序</th><th>题位</th><th>知识点</th><th>难度</th><th>分值</th><th>题干</th><th>图</th><th>答案</th></tr>
  </thead><tbody></tbody></table>
  <div id="papermeta" style="font-size:12px;color:#81858c;margin:8px 0 0"></div>

  <h2>闸门日志</h2>
  <div id="log">（等待事件）</div>
</main>
<script>
const log = (line, cls) => {
  const box = document.getElementById('log')
  if (box.textContent === '（等待事件）') box.textContent = ''
  const at = new Date().toLocaleTimeString('zh-CN')
  box.insertAdjacentHTML('afterbegin', `<div class="${cls ?? ''}">${at}  ${line}</div>`)
}

async function loadState() {
  const state = await (await fetch('/api/state')).json()
  document.querySelector('#blueprint tbody').innerHTML = state.blueprint.blueprint.map((row) => `
    <tr>
      <td><code>${row.key}</code></td>
      <td>${row.knowledge.join('、')}</td>
      <td>${row.cognitive}</td>
      <td>${row.type}</td>
      <td>${row.score}</td>
      <td><button data-slot="${row.key}">生成一道</button></td>
    </tr>`).join('')
  document.querySelector('#items tbody').innerHTML = state.items.map((item) => `
    <tr>
      <td><code>${item.id}</code></td>
      <td><code>${item.slot}</code></td>
      <td>${item.stem}</td>
      <td>${item.figure ?? ''}</td>
      <td>${item.answer}</td>
      <td>${Object.entries(item.evidence).map(([k, v]) => `<code>${k}:${v.pass ? '✓' : '✗'}</code>`).join(' ')}</td>
      <td>${item.lifecycle}</td>
    </tr>`).join('')
}

document.addEventListener('click', async (event) => {
  const slot = event.target?.dataset?.slot
  if (slot === undefined) return
  const response = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ slotKey: slot }),
  })
  const result = await response.json()
  log(result.ok ? `入库 ${result.id}` : `被拦下：${result.verdict.gate} — ${result.verdict.reason}`,
      result.ok ? 'ok' : 'no')
  await loadState()
})

document.getElementById('run').addEventListener('click', async () => {
  log('命题组开始工作（agent 内环 + 闸门外环）…')
  const run = await (await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })).json()
  for (const event of run.transcript) log(`[${event.step}] ${event.text}`, event.kind === 'gate' ? 'no' : '')
  log(`结束：${run.stopped} · 步数 ${run.steps} · 入库 ${run.stored.length}`, run.stored.length > 0 ? 'ok' : 'no')
  await loadState()
})

document.getElementById('assemble').addEventListener('click', async () => {
  const paper = await (await fetch('/api/paper', { method: 'POST' })).json()
  document.querySelector('#paper tbody').innerHTML = paper.slots.map((item, index) => `
    <tr>
      <td>${index + 1}</td>
      <td><code>${item.slot}</code></td>
      <td>${item.knowledge.join('、')}</td>
      <td><code>${item.difficulty[0]}–${item.difficulty[1]}</code></td>
      <td>${item.score}</td>
      <td>${item.stem}</td>
      <td>${item.answer}</td>
    </tr>`).join('')
  const gaps = paper.gaps.length === 0 ? '' :
    `｜缺口：${paper.gaps.map((g) => `${g.slot} ${g.reason}`).join('；')}`
  document.getElementById('papermeta').textContent =
    `满分 ${paper.totalScore} · 与蓝图差 ${paper.scoreGap} · 提交 ${paper.attempts} 次 · 缺口 ${paper.gaps.length}${gaps}`
  log(`组卷完成：${paper.slots.length} 题 · 缺口 ${paper.gaps.length}`, paper.gaps.length ? 'no' : 'ok')
})

const stream = new EventSource('/api/stream')
stream.addEventListener('stored', (event) => log(`item:stored ${JSON.parse(event.data).id}`, 'ok'))
stream.addEventListener('rejected', (event) => {
  const data = JSON.parse(event.data)
  log(`item:rejected ${data.id} — ${data.verdict.gate}：${data.verdict.reason}`, 'no')
})

await loadState()
</script>
</body>
</html>
